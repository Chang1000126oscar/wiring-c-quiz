<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工業配線丙級 學科刷題</title>
<meta name="theme-color" content="#1f2a33">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 工場盤箱的實用感，清楚、穩、好按
   IDEA: 配電盤面板 — 深色盤面、銘板、指示燈
   PICTURE: 首頁上方的盤面儀表區（三顆指示燈＋三個計數）
   COLOUR: 盤面深灰 + RAL7035 淺灰底，指示燈綠/紅/黃，各工作項目各一色
   TYPE: Noto Sans TC 內文、Barlow Condensed 數字；LAYOUT: 單欄，手機優先 */
:root{color-scheme:light dark;
--bg:light-dark(#e9ebe8,#0f1418);--card:light-dark(#ffffff,#192127);--ink:light-dark(#1a2228,#e6eaec);--mut:light-dark(#5d6970,#93a1a8);--line:light-dark(#d4d9d6,#2a343b);
--panel:#1f2a33;--panel2:#2a3742;--plate:#eef0ec;
--ok:#1f9d55;--okbg:light-dark(#e3f5ea,#123222);--bad:#d64535;--badbg:light-dark(#fbe6e3,#3a1714);--amb:#f0a020;
--s01:#2f74c0;--s02:#d4801a;--s03:#159a8c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip}
.num{font-family:"Barlow Condensed","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}

/* 盤面 */
.panel{background:var(--panel);color:#e8ecee;padding:22px 18px 20px;margin:0 -16px 0;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
@media(min-width:792px){.panel{margin:0;border-radius:0 0 22px 22px}}
.panel::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.025) 46px 47px);pointer-events:none}
.screws{position:absolute;inset:10px;pointer-events:none}
.screws i{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8a979f,#47535b);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.screws i:nth-child(1){left:0;top:0}.screws i:nth-child(2){right:0;top:0}
.badge{display:inline-block;font-size:12px;background:#f0a020;color:#1f2a33;font-weight:700;border-radius:4px;padding:1px 8px;margin-bottom:8px}
.panel h1{margin:0;font-size:clamp(26px,6vw,36px);line-height:1.12;font-weight:900;letter-spacing:.5px;text-wrap:balance}
.panel .sub{color:#a9b6bd;font-size:13.5px;margin-top:6px}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px;position:relative}
.meter{background:var(--panel2);border-radius:14px;padding:12px 12px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 rgba(0,0,0,.25)}
.lamp{width:14px;height:14px;border-radius:50%;margin-bottom:8px;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.lamp.g{background:radial-gradient(circle at 35% 35%,#9ff0bd,#1f9d55 60%);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 12px #1f9d5599}
.lamp.y{background:radial-gradient(circle at 35% 35%,#ffe2a0,#f0a020 60%);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 12px #f0a02099}
.lamp.r{background:radial-gradient(circle at 35% 35%,#ffb4aa,#d64535 60%);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 12px #d6453599}
.lamp.off{background:#3a4650;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.meter b{display:block;font-size:30px;line-height:1;color:#fff}
.meter b small{font-size:16px;color:#8fa0a8}
.meter span{font-size:12.5px;color:#a9b6bd}

h2{font-size:19px;margin:28px 2px 4px;font-weight:700}
.lead{color:var(--mut);font-size:14px;margin:0 2px 12px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px}
.step b{display:block;font-size:22px;line-height:1;color:var(--amb)}
@media(max-width:520px){.steps{grid-template-columns:1fr}.step{display:flex;gap:10px;align-items:baseline}}

/* 銘板（工作項目） */
.secs{display:flex;flex-direction:column;gap:10px}
.sec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer;position:relative}
.sec .no{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:700}
.sec h3{margin:0;font-size:16.5px;line-height:1.3}
.sec p{margin:3px 0 8px;color:var(--mut);font-size:13.5px;line-height:1.55}
.sec .tip{font-size:12.5px;color:var(--ink);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:8px;padding:4px 8px;display:inline-block}
.sec .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:#fff}
.sec.on{border-color:var(--c)}
.sec.on .ck{background:var(--c);border-color:var(--c)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-top:8px}
.prog .tr{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--c)}

/* 模式 */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{text-align:left;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.mode b{display:block;font-size:16px}
.mode span{display:block;color:var(--mut);font-size:13px;line-height:1.5;margin-top:2px}
.mode.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opts-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.sw{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer;min-height:36px}
.sw input{width:20px;height:20px;accent-color:var(--panel)}
input[type=range]{width:100%;accent-color:var(--amb)}
.go{width:100%;margin-top:16px;padding:16px;border-radius:16px;border:0;background:var(--panel);color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 3px 0 #0b1015}
.go .lamp{margin:0}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1015}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:22px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13px;padding:8px}

/* 做題 */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer;min-height:44px}
.btn.pri{background:var(--panel);color:#fff;border-color:var(--panel);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.score{font-size:14px;color:var(--mut)}
.score b{color:var(--ink);font-size:18px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--amb);transition:width .2s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;border-top:5px solid var(--c)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--c)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stem{font-size:18.5px;line-height:1.6;margin:4px 0 14px;font-weight:500}
.fig{background:#fff;border-radius:12px;padding:10px;margin-bottom:14px;border:1px solid var(--line);text-align:center}
.fig img{max-width:100%;max-height:220px;width:auto;height:auto;display:block;margin:0 auto}
.fig small{display:block;color:#6b7780;font-size:12px;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:16.5px;cursor:pointer;min-height:54px}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:15px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .k{background:var(--bad);color:#fff}
.opt.pick{border-color:var(--panel)}.opt.pick .k{background:var(--panel);color:#fff}
.opt:disabled{cursor:default}
.oimg{max-height:76px;max-width:78%;background:#fff;border-radius:8px;padding:4px}
.oimg.sm{max-height:44px;vertical-align:middle}
.fb{margin-top:14px;padding:10px 12px;border-radius:12px;font-weight:700;display:flex;gap:8px;align-items:center}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.hint{color:var(--mut);font-size:12.5px;text-align:center;margin-top:10px}
.dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between}
.dock .btn{flex:1}.dock .btn.pri{flex:1.6}

/* 結果 */
.res{background:var(--panel);color:#fff;border-radius:20px;padding:22px;text-align:center;margin-top:8px}
.res .big{font-size:72px;line-height:1;font-weight:700}
.res .mut{color:#a9b6bd}
.res .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.res .btn{background:var(--panel2);color:#fff;border-color:transparent}
.res .btn.pri{background:#f0a020;color:#1f2a33;border-color:#f0a020}
.bysec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;text-align:left}
.bysec div{background:var(--panel2);border-radius:12px;padding:8px 10px;font-size:12.5px;color:#a9b6bd;border-left:4px solid var(--c)}
.bysec b{display:block;color:#fff;font-size:20px}
.rv{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rv .q{font-weight:500}
.rv .a{font-size:14px;margin-top:6px}
.rv .a.mine{color:var(--bad)}.rv .a.right{color:var(--ok);font-weight:700}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.mbox{background:var(--card);border-radius:18px;padding:20px;max-width:360px;width:100%}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--panel);color:#fff;padding:10px 18px;border-radius:99px;z-index:9;font-size:14px}
@media (prefers-reduced-motion:no-preference){.lamp.g,.lamp.y{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{filter:brightness(1.18)}}}
</style>
</head>

  <div class="modes">${MODES.map(([k,t,d])=>`<button class="mode ${cfg.mode==k?'on':''}" data-m="${k}"><b>${t}${k=='wrong'&&wb?` <span class="num" style="display:inline;color:var(--amb)">${wb}</span>`:''}</b><span>${d}</span></button>`).join('')}</div>
  <div class="opts-box">
    ${cfg.mode=='exam'?`<div style="display:flex;justify-content:space-between"><span>抽題數</span><b class="num" id="nv" style="font-size:20px">${Math.min(cfg.n,n)} 題</b></div>
    <input type="range" min="10" max="${Math.max(10,Math.min(80,n))}" step="5" value="${Math.min(cfg.n,n)}" id="nr" aria-label="抽題數">
    <div class="lead" style="margin:2px 0 8px">正式學科測驗為 80 題單選、60 分及格。</div>`:''}
    <label class="sw"><input type="checkbox" id="shuf" ${cfg.shuf?'checked':''}>選項順序也打亂（防止背「答案是 ③」）</label>
  </div>
  <button class="go" id="go"><span class="lamp g"></span>開始 · ${cfg.mode=='wrong'?wrongs().filter(q=>cfg.secs.includes(q.sec)).length:cfg.mode=='exam'?Math.min(cfg.n,n):n} 題</button>
  <div class="foot">作答紀錄只存在這台裝置的瀏覽器裡。<br><button class="link" id="reset">清除作答紀錄</button></div>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s;cfg.secs=cfg.secs.includes(k)?cfg.secs.filter(x=>x!=k):[...cfg.secs,k].sort();if(!cfg.secs.length){cfg.secs=[k];toast('至少要選一個工作項目')}persist();home()});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.m;persist();home()});
  const nr=$('#nr');if(nr)nr.oninput=()=>{cfg.n=+nr.value;$('#nv').textContent=cfg.n+' 題';$('#go').lastChild.textContent='開始 · '+cfg.n+' 題';persist()};
  $('#shuf').onchange=e=>{cfg.shuf=e.target.checked;persist()};
  $('#go').onclick=start;
  $('#reset').onclick=async()=>{if(await ask('確定清除所有作答紀錄與錯題本？')){store.s={};save();home()}};
}

function start(){
  let qs;
  if(cfg.mode=='wrong'){qs=shuffle(wrongs().filter(q=>cfg.secs.includes(q.sec)));if(!qs.length){toast('這個範圍的錯題本是空的');return}}
  else if(cfg.mode=='seq') qs=pool();
  else if(cfg.mode=='random') qs=shuffle(pool());
  else qs=shuffle(pool()).slice(0,cfg.n);
  S={mode:cfg.mode,qs:qs.map(q=>({q,order:(cfg.shuf&&!q.oimg)?shuffle([0,1,2,3]):[0,1,2,3],pick:null})),i:0};
  show();
}

function show(){
  const it=S.qs[S.i], q=it.q, s=SEC[q.sec], exam=S.mode=='exam';
  const answered=it.pick!==null, reveal=answered&&!exam;
  const right=S.qs.filter(x=>x.pick!==null&&x.pick===x.q.ans-1).length, ans=S.qs.filter(x=>x.pick!==null).length;
  const last=S.i==S.qs.length-1;
  app.innerHTML=`
  <div class="qtop"><button class="btn" id="back">← 首頁</button>
    <span class="score">${exam?`已作答 <b class="num">${ans}</b>/${S.qs.length}`:`答對 <b class="num">${right}</b> / ${ans}`}</span></div>
  <div class="bar"><i style="width:${(S.i+1)/S.qs.length*100}%"></i></div>
  <article class="qcard" style="--c:${s.c}">
    <div class="qmeta"><span class="pill"><i></i>工作項目 ${q.sec} · ${s.name}</span><span class="num" style="font-size:15px">${S.i+1} / ${S.qs.length}</span></div>
    <div class="qmeta" style="margin-top:-4px"><span>題庫第 ${q.n} 題</span>${st(q).w?`<span style="color:var(--amb)">曾答錯 ${st(q).w} 次</span>`:''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${q.img?`<div class="fig"><img src="${q.img}" alt="題目附圖"><small>題目附圖</small></div>`:''}
    <div class="opts">${it.order.map((oi,pos)=>{
      let c='';if(reveal){if(oi===q.ans-1)c='ok';else if(oi===it.pick)c='bad'}else if(exam&&oi===it.pick)c='pick';
      return `<button class="opt ${c}" data-o="${oi}" ${reveal?'disabled':''}><span class="k">${pos+1}</span>${q.oimg?`<img class="oimg" src="${q.oimg[oi]}" alt="選項${pos+1}">`:`<span>${esc(q.opts[oi])}</span>`}</button>`}).join('')}</div>
    ${reveal?`<div class="fb ${it.pick===q.ans-1?'ok':'bad'}">${it.pick===q.ans-1?'✔ 答對了':'✘ 答錯，正確答案是第 '+(it.order.indexOf(q.ans-1)+1)+' 個選項，已加入錯題本'}</div>`:''}
    ${exam&&!answered?`<div class="hint">模擬測驗不會馬上對答案，交卷後一起看。</div>`:''}
  </article>
  <div class="hint">電腦可用鍵盤：1–4 作答、Enter 下一題、← 上一題</div>`;
  $('#back').onclick=async()=>{if(S.mode!='exam'||await ask('離開會放棄這次測驗，確定？'))home()};
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  dock.classList.remove('hide');
  dockIn.innerHTML=`<button class="btn" id="prev" ${S.i?'':'disabled'}>上一題</button>
   ${exam?`<button class="btn" id="fin">交卷</button>`:''}
   <button class="btn pri" id="next" ${(!exam&&!answered)?'disabled':''}>${last?(exam?'交卷':'看結果'):'下一題 →'}</button>`;
  $('#prev').onclick=()=>{S.i--;show()};
  const submit=async()=>{const left=S.qs.filter(x=>x.pick===null).length;if(!left||await ask(`還有 ${left} 題沒作答，確定交卷？`))finish()};
  $('#next').onclick=()=>{if(last){exam?submit():finish()}else{S.i++;show()}};
  if(exam)$('#fin').onclick=submit;
  window.scrollTo(0,0);
}

function record(q,ok){
  const s=store.s[q.id]=store.s[q.id]||{c:0,w:0,wb:false};
  if(ok){s.c++;if(S.mode=='wrong')s.wb=false}else{s.w++;s.wb=true}
  save();
}
function pick(oi){
  const it=S.qs[S.i];
  if(S.mode=='exam'){it.pick=oi;show();return}
  if(it.pick!==null)return;
  it.pick=oi;record(it.q,oi===it.q.ans-1);show();
}
function finish(){
  if(S.mode=='exam')S.qs.forEach(it=>record(it.q,it.pick===it.q.ans-1));
  const n=S.qs.length, r=S.qs.filter(x=>x.pick===x.q.ans-1).length, score=Math.round(r/n*100);
  const miss=S.qs.filter(x=>x.pick!==x.q.ans-1);
  const secs=[...new Set(S.qs.map(x=>x.q.sec))].sort();
  dock.classList.add('hide');
  const title={seq:'依序練習',random:'隨機刷題',exam:'模擬測驗',wrong:'錯題本'}[S.mode];
  app.innerHTML=`
  <div class="qtop"><button class="btn" id="back">← 首頁</button><span class="score">${title}</span></div>
  <section class="res">
    <div class="mut">${S.mode=='exam'?'測驗成績':'這一輪的得分'}</div>
    <div class="big num" style="color:${score>=60?'#6fe39a':'#ff8a7a'}">${score}</div>
    <div>答對 ${r} / ${n} 題${S.mode=='exam'?(score>=60?' · 及格':' · 未達 60 分及格線'):''}</div>
    ${secs.length>1?`<div class="bysec">${secs.map(k=>{const a=S.qs.filter(x=>x.q.sec==k),b=a.filter(x=>x.pick===x.q.ans-1).length;return `<div style="--c:${SEC[k].c}">工作項目 ${k}<b class="num">${b}/${a.length}</b></div>`}).join('')}</div>`:''}
    <div class="row"><button class="btn pri" id="again">再來一輪</button>${miss.length?`<button class="btn" id="redo">只重做錯的 ${miss.length} 題</button>`:''}</div>
  </section>
  ${miss.length?`<h2>錯題檢討</h2><p class="lead">這些題目都已經加入錯題本。</p>${miss.map(it=>{const q=it.q;return `<div class="rv" style="--c:${SEC[q.sec].c}">
    <div class="qmeta"><span class="pill"><i></i>${q.sec}-${q.n}</span></div>
    <div class="q">${esc(q.stem)}</div>
    ${q.img?`<div class="fig" style="margin:8px 0"><img src="${q.img}" alt=""></div>`:''}
    <div class="a mine">你的答案：${it.pick===null?'未作答':oh(q,it.pick)}</div>
    <div class="a right">正確答案：${oh(q,q.ans-1)}</div></div>`}).join('')}`:`<p class="lead" style="text-align:center;margin-top:16px">全對，沒有錯題。</p>`}`;
  $('#back').onclick=home;$('#again').onclick=start;
  if(miss.length)$('#redo').onclick=()=>{S={mode:S.mode=='exam'?'random':S.mode,qs:shuffle(miss).map(it=>({q:it.q,order:it.order,pick:null})),i:0};show()};
  window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!S||dock.classList.contains('hide')||document.querySelector('.modal'))return;
  const it=S.qs[S.i];
  if(['1','2','3','4'].includes(e.key))pick(it.order[+e.key-1]);
  else if(e.key=='Enter'||e.key=='ArrowRight'){const n=$('#next');if(n&&!n.disabled)n.click()}
  else if(e.key=='ArrowLeft'){const p=$('#prev');if(p&&!p.disabled)p.click()}
});
home();
}
</script>
</body>
</html>
