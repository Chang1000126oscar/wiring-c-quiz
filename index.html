<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工業配線丙級 學科刷題</title>
<meta name="theme-color" content="#1f2a33">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 工場盤箱的實用感，清楚、穩、好按
   IDEA: 配電盤面板 — 深色盤面、銘板、指示燈
   PICTURE: 首頁上方的盤面儀表區（三顆指示燈＋三個計數）
   COLOUR: 盤面深灰 + RAL7035 淺灰底，指示燈綠/紅/黃，各工作項目各一色
   TYPE: Noto Sans TC 內文、Barlow Condensed 數字；LAYOUT: 單欄，手機優先 */
:root{color-scheme:light dark;
--bg:light-dark(#e9ebe8,#0f1418);--card:light-dark(#ffffff,#192127);--ink:light-dark(#1a2228,#e6eaec);--mut:light-dark(#5d6970,#93a1a8);--line:light-dark(#d4d9d6,#2a343b);
--panel:#1f2a33;--panel2:#2a3742;--plate:#eef0ec;
--ok:#1f9d55;--okbg:light-dark(#e3f5ea,#123222);--bad:#d64535;--badbg:light-dark(#fbe6e3,#3a1714);--amb:#f0a020;
--s01:#2f74c0;--s02:#d4801a;--s03:#159a8c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip}
.num{font-family:"Barlow Condensed","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}

/* 盤面 */
.panel{background:var(--panel);color:#e8ecee;padding:22px 18px 20px;margin:0 -16px 0;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
@media(min-width:792px){.panel{margin:0;border-radius:0 0 22px 22px}}
.panel::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.025) 46px 47px);pointer-events:none}
.screws{position:absolute;inset:10px;pointer-events:none}
.screws i{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8a979f,#47535b);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.screws i:nth-child(1){left:0;top:0}.screws i:nth-child(2){right:0;top:0}
.badge{display:inline-block;font-size:12px;background:#f0a020;color:#1f2a33;font-weight:700;border-radius:4px;padding:1px 8px;margin-bottom:8px}
.panel h1{margin:0;font-size:clamp(26px,6vw,36px);line-height:1.12;font-weight:900;letter-spacing:.5px;text-wrap:balance}
.panel .sub{color:#a9b6bd;font-size:13.5px;margin-top:6px}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px;position:relative}
.meter{background:var(--panel2);border-radius:14px;padding:12px 12px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 rgba(0,0,0,.25)}
.lamp{width:14px;height:14px;border-radius:50%;margin-bottom:8px;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.lamp.g{background:radial-gradient(circle at 35% 35%,#9ff0bd,#1f9d55 60%);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 12px #1f9d5599}
.lamp.y{background:radial-gradient(circle at 35% 35%,#ffe2a0,#f0a020 60%);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 12px #f0a02099}
.lamp.r{background:radial-gradient(circle at 35% 35%,#ffb4aa,#d64535 60%);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 12px #d6453599}
.lamp.off{background:#3a4650;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.meter b{display:block;font-size:30px;line-height:1;color:#fff}
.meter b small{font-size:16px;color:#8fa0a8}
.meter span{font-size:12.5px;color:#a9b6bd}

h2{font-size:19px;margin:28px 2px 4px;font-weight:700}
.lead{color:var(--mut);font-size:14px;margin:0 2px 12px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px}
.step b{display:block;font-size:22px;line-height:1;color:var(--amb)}
@media(max-width:520px){.steps{grid-template-columns:1fr}.step{display:flex;gap:10px;align-items:baseline}}

/* 銘板（工作項目） */
.secs{display:flex;flex-direction:column;gap:10px}
.sec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer;position:relative}
.sec .no{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:700}
.sec h3{margin:0;font-size:16.5px;line-height:1.3}
.sec p{margin:3px 0 8px;color:var(--mut);font-size:13.5px;line-height:1.55}
.sec .tip{font-size:12.5px;color:var(--ink);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:8px;padding:4px 8px;display:inline-block}
.sec .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:#fff}
.sec.on{border-color:var(--c)}
.sec.on .ck{background:var(--c);border-color:var(--c)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-top:8px}
.prog .tr{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--c)}

/* 模式 */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{text-align:left;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.mode b{display:block;font-size:16px}
.mode span{display:block;color:var(--mut);font-size:13px;line-height:1.5;margin-top:2px}
.mode.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opts-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.sw{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer;min-height:36px}
.sw input{width:20px;height:20px;accent-color:var(--panel)}
input[type=range]{width:100%;accent-color:var(--amb)}
.go{width:100%;margin-top:16px;padding:16px;border-radius:16px;border:0;background:var(--panel);color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 3px 0 #0b1015}
.go .lamp{margin:0}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1015}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:22px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13px;padding:8px}

/* 做題 */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer;min-height:44px}
.btn.pri{background:var(--panel);color:#fff;border-color:var(--panel);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{background:#f0a020;border-color:#f0a020;color:#1f2a33}}
:root[data-theme=dark] .btn.pri{background:#f0a020;border-color:#f0a020;color:#1f2a33}
.score{font-size:14px;color:var(--mut)}
.score b{color:var(--ink);font-size:18px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--amb);transition:width .2s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;border-top:5px solid var(--c)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--c)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stem{font-size:18.5px;line-height:1.6;margin:4px 0 14px;font-weight:500}
.fig{background:#fff;border-radius:12px;padding:10px;margin-bottom:14px;border:1px solid var(--line);text-align:center}
.fig img{max-width:100%;max-height:220px;width:auto;height:auto;display:block;margin:0 auto}
.fig small{display:block;color:#6b7780;font-size:12px;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:16.5px;cursor:pointer;min-height:54px}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:15px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .k{background:var(--bad);color:#fff}
.opt.pick{border-color:var(--panel)}.opt.pick .k{background:var(--panel);color:#fff}
.opt:disabled{cursor:default}
.oimg{max-height:76px;max-width:78%;background:#fff;border-radius:8px;padding:4px}
.oimg.sm{max-height:44px;vertical-align:middle}
.fb{margin-top:14px;padding:10px 12px;border-radius:12px;font-weight:700;display:flex;gap:8px;align-items:center}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.ex{margin-top:10px;padding:12px 14px;border-radius:12px;background:light-dark(#f3f5f2,#141b20);border-left:4px solid var(--amb);font-size:15px;line-height:1.7}
.ex b{display:block;font-size:13px;color:var(--amb);margin-bottom:2px}
.chip-t{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13.5px;cursor:pointer;min-height:36px;margin-left:auto}
.chip-t.on{border-color:var(--ok);color:var(--ok);font-weight:700}
.fb{flex-wrap:wrap;position:relative;overflow:hidden}
.stay{margin-left:auto;border:0;background:var(--ok);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:40px}
.cd{position:absolute;left:0;bottom:0;height:3px;width:100%}.cd i{display:block;height:100%;background:var(--ok);animation:cd 1.2s linear forwards}@keyframes cd{from{width:100%}to{width:0}}
.flash{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:700;padding:6px 16px;border-radius:99px;z-index:9;font-size:15px;pointer-events:none}
.hint{color:var(--mut);font-size:12.5px;text-align:center;margin-top:10px}
.dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between}
.dock .btn{flex:1}.dock .btn.pri{flex:1.6}

/* 結果 */
.res{background:var(--panel);color:#fff;border-radius:20px;padding:22px;text-align:center;margin-top:8px}
.res .big{font-size:72px;line-height:1;font-weight:700}
.res .mut{color:#a9b6bd}
.res .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.res .btn{background:var(--panel2);color:#fff;border-color:transparent}
.res .btn.pri{background:#f0a020;color:#1f2a33;border-color:#f0a020}
.bysec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;text-align:left}
.bysec div{background:var(--panel2);border-radius:12px;padding:8px 10px;font-size:12.5px;color:#a9b6bd;border-left:4px solid var(--c)}
.bysec b{display:block;color:#fff;font-size:20px}
.rv{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rv .q{font-weight:500}
.rv .a{font-size:14px;margin-top:6px}
.rv .a.mine{color:var(--bad)}.rv .a.right{color:var(--ok);font-weight:700}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.mbox{background:var(--card);border-radius:18px;padding:20px;max-width:360px;width:100%}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--panel);color:#fff;padding:10px 18px;border-radius:99px;z-index:9;font-size:14px}
@media (prefers-reduced-motion:no-preference){.lamp.g,.lamp.y{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{filter:brightness(1.18)}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="dock hide" id="dock"><div class="in" id="dockIn"></div></div>
<script>

const DATA = {"sections": {"01": "識圖與繪圖", "02": "電氣器具之裝置", "03": "電氣器具之使用"}, "questions": [{"sec": "01", "n": 1, "ans": 1, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["有機械連鎖之電驛線圈", "沒有機械連鎖之電驛線圈", "接於直流之電驛線圈", "接於交流之電驛線圈"], "img": "img/01-01.png", "ex": "一般電驛線圈只是單純的長方框（見第 11 題）。這題方框旁多一個附加格，裡面是閂鎖記號，表示電驛帶有機械連鎖（閂鎖）機構。"}, {"sec": "01", "n": 2, "ans": 4, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["有機械連鎖之電驛線圈", "沒有機械連鎖之電驛線圈", "接於直流之電驛線圈", "接於交流之電驛線圈"], "img": "img/01-02.png", "ex": "線圈方框旁的附加格畫「∿」正弦波，代表線圈接交流電源。如果是直流，附加格會畫「—」。"}, {"sec": "01", "n": 3, "ans": 4, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["有機械連鎖之常閉接點", "能延時動作的常閉接點", "極限開關的常開接點", "極限開關的常閉接點"], "img": "img/01-03.png", "ex": "接點平時閉合，是常閉接點。刀片上有直角三角形凸塊，表示接點是被機械凸輪或擋塊碰觸而動作，也就是極限（限制）開關。"}, {"sec": "01", "n": 4, "ans": 2, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["有機械連鎖之常開接點", "能延時復歸的常開接點", "常開接點", "常閉接點"], "img": "img/01-04.png", "ex": "這是常開接點，刀片上加了圓弧（降落傘形）延時記號。題庫答案是「能延時復歸」，也就是斷電延時的常開接點。它跟第 52、53 題的通電延時記號樣式不同，要分開記。"}, {"sec": "01", "n": 5, "ans": 3, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["有機械連鎖之常開接點", "能延時動作的常開接點", "按鈕開關的常開接點", "按鈕開關的常閉接點"], "img": "img/01-05.png", "ex": "常開接點加一條虛線（機械連動）連到「ㄒ」形按壓頭，代表用手按壓操作，所以是按鈕開關的常開接點。"}, {"sec": "01", "n": 6, "ans": 4, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["有機械連鎖之常閉接點", "能延時動作的常閉接點", "緊急停止用之常開接點", "緊急停止用之常閉接點"], "img": "img/01-06.png", "ex": "操作頭是蘑菇頭（菇形），代表緊急停止按鈕。接點平時閉合，是常閉接點。緊急停止一定用 b 接點，按下就切斷電路。"}, {"sec": "01", "n": 7, "ans": 1, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["拉動以啟閉之常閉接點", "轉動以啟閉之常閉接點", "能延時動作之常閉接點", "緊急停止用之常閉接點"], "img": "img/01-07.png", "ex": "接點平時閉合（常閉）。操作記號跟按鈕的「ㄒ」形、旋轉的階梯形都不同，這是「拉動」操作的記號。"}, {"sec": "01", "n": 8, "ans": 2, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["拉動以啟閉之常開接點", "轉動以啟閉之常開接點", "能延時動作之常開接點", "緊急停止用之常開接點"], "img": "img/01-08.png", "ex": "常開接點，操作記號是階梯（ㄣ）形，代表旋轉操作，例如選擇開關、旋鈕。"}, {"sec": "01", "n": 9, "ans": 4, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["指示燈", "電阻", "線圈", "蜂鳴器"], "img": "img/01-09.png", "ex": "IEC 符號中，半圓碗形加兩條引線是蜂鳴器；指示燈是圓圈內打叉（見第 10 題）。"}, {"sec": "01", "n": 10, "ans": 2, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["蜂鳴器", "能閃爍的指示燈", "接交流電之電磁鐵", "接於交流之電驛線圈"], "img": "img/01-10.png", "ex": "圓圈內打叉是指示燈，旁邊再加一個方波（脈波）記號，表示會閃爍。"}, {"sec": "01", "n": 11, "ans": 3, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["指示燈", "蜂鳴器", "電驛之線圈", "栓型保險絲"], "img": "img/01-11.png", "ex": "單純的長方框加上下引線，是 IEC 電驛（接觸器）線圈的一般符號。"}, {"sec": "01", "n": 12, "ans": 4, "stem": "線圈符號旁加註TC者為", "opts": ["投入線圈", "動作線圈", "記憶線圈", "跳脫線圈"], "img": null, "ex": "TC 是 Trip Coil，跳脫線圈，用在斷路器跳脫。投入線圈是 CC（Closing Coil）。"}, {"sec": "01", "n": 13, "ans": 2, "stem": "左圖所示之符號為", "opts": ["電磁電驛線圈", "感應電動機", "同步電動機", "交流電流表"], "img": "img/01-13.png", "ex": "圓圈內 M 代表電動機（Motor），IM 是 Induction Motor，感應電動機。同步電動機標 SM。"}, {"sec": "01", "n": 14, "ans": 3, "stem": "如左圖所示之符號為", "opts": ["交流電動機", "直流電動機", "直流發電機", "交流發電機"], "img": "img/01-14.png", "ex": "G 是發電機（Generator），G 下方畫直線「—」代表直流，所以是直流發電機。電動機用 M。"}, {"sec": "01", "n": 15, "ans": 2, "stem": "如左圖所示之符號為", "opts": ["直流發電機", "交流發電機", "直流電動機", "接地電壓表"], "img": "img/01-15.png", "ex": "G 下方畫「～」代表交流，所以是交流發電機。可以跟第 14 題對照記。"}, {"sec": "01", "n": 16, "ans": 1, "stem": "如下圖所示之符號為", "opts": ["繞線型感應電動機", "鼠籠型感應電動機", "感應發電機", "同步發電機"], "img": "img/01-16.png", "ex": "IM 外面是雙圓，而且下方另有三條引線（經滑環從轉子引出），這是繞線型感應電動機。鼠籠型的轉子是短路的，沒有引出線。"}, {"sec": "01", "n": 17, "ans": 2, "stem": "零相比流器之符號為", "opts": ["", "", "", ""], "img": null, "oimg": ["img/01-17-1.png", "img/01-17-2.png", "img/01-17-3.png", "img/01-17-4.png"], "ex": "零相比流器（ZCT）是讓三相導線一起穿過同一個鐵心，用來偵測漏電（零相）電流。② 就是三條線一起穿過鐵心的畫法。"}, {"sec": "01", "n": 18, "ans": 1, "stem": "如左圖所示之符號為", "opts": ["無效功率表", "有效功率表", "視在電力表", "功因表"], "img": "img/01-18.png", "ex": "VAR 是無效功率的單位（乏），所以是無效功率表。有效功率表標 W，視在功率的單位是 VA。"}, {"sec": "01", "n": 19, "ans": 3, "stem": "如左圖所示之符號為", "opts": ["功率表", "瓦時表", "功率因數表", "無效功因表"], "img": "img/01-19.png", "ex": "PF 是 Power Factor，功率因數表。"}, {"sec": "01", "n": 20, "ans": 2, "stem": "如左圖所示之符號為", "opts": ["電流表", "伏特表", "功因表", "瓦特表"], "img": "img/01-20.png", "ex": "圓圈內 V 是電壓表（伏特表）。電流表標 A，瓦特表標 W。"}, {"sec": "01", "n": 21, "ans": 1, "stem": "下列符號何者為電解質電容器？", "opts": ["", "", "", ""], "img": null, "oimg": ["img/01-21-1.png", "img/01-21-2.png", "img/01-21-3.png", "img/01-21-4.png"], "ex": "① 有標「＋」極性，而且一邊極板是塗黑（或斜線）的，表示有極性的電解質電容器。②～④ 是一般或其他電容畫法。"}, {"sec": "01", "n": 22, "ans": 4, "stem": "如左圖所示之符號為", "opts": ["紅色指示燈", "白色指示燈", "黃色指示燈", "綠色指示燈"], "img": "img/01-22.png", "ex": "圓圈內打叉是指示燈，中間的字母代表顏色：G＝Green 綠色。另外 R 是紅、Y 是黃、W 是白。"}, {"sec": "01", "n": 23, "ans": 3, "stem": "如左圖所示之符號為", "opts": ["單極單投開關", "三極雙投開關", "三極單投開關", "單極雙投開關"], "img": "img/01-23.png", "ex": "動片上有三條短斜線，代表三極；只有一個投入位置，代表單投。合起來是三極單投開關。"}, {"sec": "01", "n": 24, "ans": 4, "stem": "下列何者為雙極雙投之開關符號？", "opts": ["", "", "", ""], "img": null, "oimg": ["img/01-24-1.png", "img/01-24-2.png", "img/01-24-3.png", "img/01-24-4.png"], "ex": "④ 兩組接點用虛線連動，代表雙極；每組都有兩個可以投入的位置，代表雙投。"}, {"sec": "01", "n": 25, "ans": 3, "stem": "如下圖所示之符號為", "opts": ["電磁開關b接點", "電磁開關a接點", "按鈕開關a接點", "按鈕開關b接點"], "img": "img/01-25.png", "ex": "這是 CNS 畫法：兩個接點圓上方有橫桿，橫桿上有按壓記號，平時打開，所以是按鈕開關 a 接點。"}, {"sec": "01", "n": 26, "ans": 2, "stem": "如下圖所示之符號為", "opts": ["通電延時動作電驛a接點", "斷電延時復歸電驛a接點", "手動復歸b接點", "殘留a接點"], "img": "img/01-26.png", "ex": "CNS 畫法中，接點旁的三角形「△」是延時記號。依題庫，這個畫法是斷電延時復歸電驛的 a 接點。"}, {"sec": "01", "n": 27, "ans": 3, "stem": "如下圖所示之符號為", "opts": ["a接點", "b接點", "熱動a接點", "限時復歸a接點"], "img": "img/01-27.png", "ex": "接點旁打「×」是積熱電驛（熱動）接點的 CNS 畫法。這個接點平時打開，所以是熱動 a 接點。"}, {"sec": "01", "n": 28, "ans": 2, "stem": "如左圖所示之符號為", "opts": ["限時動作接點", "殘留接點", "手捺開關接點", "自動復歸接點"], "img": "img/01-28.png", "ex": "按鈕橫桿上方多一個勾形記號，這是殘留接點：動作後會保持，不會自動復歸。"}, {"sec": "01", "n": 29, "ans": 1, "stem": "限制開關（Limit Switch）之常開接點（N.O）符號為", "opts": ["", "", "", ""], "img": null, "oimg": ["img/01-29-1.png", "img/01-29-2.png", "img/01-29-3.png", "img/01-29-4.png"], "ex": "① 接點上方有一個長方形擋塊，代表接點由機械碰觸動作，也就是限制開關（LS）；接點平時打開，所以是常開接點。"}, {"sec": "01", "n": 30, "ans": 2, "stem": "如左圖所示之符號為何種開關之接點？", "opts": ["按鈕開關", "限制開關", "光電開關", "切換開關"], "img": "img/01-30.png", "ex": "長方形擋塊壓在接點上方，是限制開關的接點。可以跟第 29 題一起記。"}, {"sec": "01", "n": 31, "ans": 1, "stem": "自動電壓調節器之英文縮寫符號為", "opts": ["AVR", "PCB", "ACB", "OCB"], "img": null, "ex": "AVR＝Automatic Voltage Regulator，自動電壓調節器。PCB 是印刷電路板，ACB 是空氣斷路器，OCB 是油斷路器。"}, {"sec": "01", "n": 32, "ans": 3, "stem": "避雷器之英文縮寫為", "opts": ["RC", "SC", "LA", "TB"], "img": null, "ex": "LA＝Lightning Arrester，避雷器。"}, {"sec": "01", "n": 33, "ans": 1, "stem": "接線端子台的英文縮寫符號為", "opts": ["TB", "PB", "ACB", "COS"], "img": null, "ex": "TB＝Terminal Block，端子台。PB 是按鈕開關，COS 是切換開關。"}, {"sec": "01", "n": 34, "ans": 4, "stem": "限制開關的英文縮寫符號為", "opts": ["BS", "PS", "SS", "LS"], "img": null, "ex": "LS＝Limit Switch，限制開關。BS 是按鈕開關，PS 是壓力開關，SS 是選擇開關。"}, {"sec": "01", "n": 35, "ans": 4, "stem": "直流的英文縮寫符號為", "opts": ["AC", "BC", "CC", "DC"], "img": null, "ex": "DC＝Direct Current，直流。AC＝Alternating Current，交流。"}, {"sec": "01", "n": 36, "ans": 1, "stem": "如下圖所示之符號為", "opts": ["按鈕開關接點", "限制開關接點", "閃爍電驛接點", "限時電驛接點"], "img": "img/01-36.png", "ex": "接點上方有按壓桿記號，是 CNS 的按鈕開關接點畫法。"}, {"sec": "01", "n": 37, "ans": 2, "stem": "電路圖中，如下圖所示之符號為", "opts": ["電阻器", "積熱電驛", "熱敏電阻", "輔助電驛"], "img": "img/01-37.png", "ex": "TH-RY＝Thermal Relay，積熱電驛。圖形是電驛裡串在主電路上的加熱元件。"}, {"sec": "01", "n": 38, "ans": 2, "stem": "如下圖所示之符號為", "opts": ["電磁開關a接點", "電磁開關b接點", "按鈕開關a接點", "按鈕開關b接點"], "img": "img/01-38.png", "ex": "直線上兩條平行短線代表接點，再加一條斜線表示 b 接點（常閉）。沒有按壓或碰觸記號，所以是電磁開關（電驛）本身的 b 接點。"}, {"sec": "01", "n": 39, "ans": 2, "stem": "變壓器之符號為", "opts": ["", "", "", ""], "img": null, "oimg": ["img/01-39-1.png", "img/01-39-2.png", "img/01-39-3.png", "img/01-39-4.png"], "ex": "② 是兩組線圈中間夾著平行直線（代表鐵心），這是變壓器。有斜箭頭的是可調元件。"}, {"sec": "01", "n": 40, "ans": 2, "stem": "如下圖所示之符號為", "opts": ["可調電阻器", "可調自耦變壓器", "電鈴", "蜂鳴器"], "img": "img/01-40.png", "ex": "線圈上有箭頭滑動接觸，可以改變匝數，這是可調自耦變壓器（俗稱 Slidac）。"}, {"sec": "01", "n": 41, "ans": 4, "stem": "電子裝置中，圖中符號表示", "opts": ["電晶體", "整流二極體", "放大器", "穩壓二極體"], "img": "img/01-41.png", "ex": "二極體的陰極那條橫棒兩端彎折，是稽納二極體，也就是穩壓二極體。整流二極體的陰極是直棒。"}, {"sec": "01", "n": 42, "ans": 1, "stem": "如左圖所示之符號為", "opts": ["保險絲", "電阻", "線圈", "電驛"], "img": "img/01-42.png", "ex": "IEC 符號中，長方形中間被一條線貫穿是保險絲。電阻是單純的長方形。"}, {"sec": "01", "n": 43, "ans": 1, "stem": "左圖所示之符號為", "opts": ["接地", "短路", "斷路", "中性線"], "img": "img/01-43.png", "ex": "一條直線接到下方斜線（或短橫線），代表接地。"}, {"sec": "01", "n": 44, "ans": 4, "stem": "如左圖所示之符號為", "opts": ["驅動線圈", "電磁接觸器", "磁場線圈", "比流器"], "img": "img/01-44.png", "ex": "一次側端子標 K、二次側端子標 L，是比流器（CT）的端子標示。"}, {"sec": "01", "n": 45, "ans": 4, "stem": "如左圖所示之符號為", "opts": ["SCR", "UJT", "NPN晶體", "PNP晶體"], "img": "img/01-45.png", "ex": "射極箭頭指向內部是 PNP，箭頭朝外是 NPN。記法：PNP 是「Pointing iN」。"}, {"sec": "01", "n": 46, "ans": 1, "stem": "如下圖所示氣壓控制閥，其型式為", "opts": ["四孔二位閥", "四孔三位閥", "五孔二位閥", "五孔三位閥"], "img": "img/01-46.png", "ex": "數接口：A、B、P、R 共 4 個口；數方格：2 格就是 2 個位置。所以是四孔（口）二位閥。"}, {"sec": "01", "n": 47, "ans": 2, "stem": "通電開始計時的延時電驛，其計時到接點斷開的接點符號為", "opts": ["", "", "", ""], "img": null, "oimg": ["img/01-47-1.png", "img/01-47-2.png", "img/01-47-3.png", "img/01-47-4.png"], "ex": "通電後開始計時、時間到才把接點斷開，就是通電延時的 b 接點（限時動作 b 接點），對應選項 ②。"}, {"sec": "01", "n": 48, "ans": 4, "stem": "限制開關LS未受到碰觸時，其內部b接點的電路符號為", "opts": ["", "", "", ""], "img": null, "oimg": ["img/01-48-1.png", "img/01-48-2.png", "img/01-48-3.png", "img/01-48-4.png"], "ex": "限制開關沒被碰觸時，b 接點是閉合的。④ 是接點閉合、擋塊在下方的畫法。"}, {"sec": "01", "n": 49, "ans": 3, "stem": "如下圖所示IEC國際標準符號為", "opts": ["限時動作之常開接點", "緊急停止用之常閉接點", "積熱過載保護電驛常開接點", "轉動以啟閉之常開接點"], "img": "img/01-49.png", "ex": "操作記號是「ㄈ」形，代表熱動元件，所以是積熱（過載）保護電驛；接點平時打開，是常開接點。"}, {"sec": "01", "n": 50, "ans": 3, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["電磁接觸器輔助常開接點", "電磁接觸器線圈", "電磁接觸器輔助常閉接點", "輔助電驛常開接點"], "img": "img/01-50.png", "ex": "KM 是電磁接觸器的代號。刀片上端有勾，代表常閉，所以是電磁接觸器的輔助常閉接點。"}, {"sec": "01", "n": 51, "ans": 1, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["限時電驛線圈", "輔助電驛線圈", "指示燈", "溫度開關線"], "img": "img/01-51.png", "ex": "線圈方框旁加一個打叉的小格，是限時電驛（計時器）線圈。"}, {"sec": "01", "n": 52, "ans": 2, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["限時電驛通電延時常閉接點", "限時電驛通電延時常開接點", "限時電驛斷電延時常閉接點", "限時電驛斷電延時常開接點"], "img": "img/01-52.png", "ex": "刀片上有圓弧形（降落傘）延時記號，接點是常開，題庫定為通電延時常開接點，也就是限時動作 a 接點。"}, {"sec": "01", "n": 53, "ans": 1, "stem": "如下圖所示，IEC國際標準符號為", "opts": ["限時電驛通電延時常閉接點", "限時電驛通電延時常開接點", "限時電驛斷電延時常閉接點", "限時電驛斷電延時常開接點"], "img": "img/01-53.png", "ex": "延時記號跟第 52 題一樣，但接點是常閉，所以是通電延時常閉接點，也就是限時動作 b 接點。"}, {"sec": "01", "n": 54, "ans": 4, "stem": "下圖為兩只電磁接觸器（KM1、KM2）主接點符號，中間虛線及▽符號代表兩只電磁接觸器", "opts": ["通電延時", "電器連鎖", "斷電延時", "機械連鎖"], "img": "img/01-54.png", "ex": "兩組主接點之間用虛線連起來並加上「▽」，代表機械連鎖：兩只接觸器不能同時吸合，常用在正反轉電路。"}, {"sec": "01", "n": 55, "ans": 2, "stem": "如下圖所示為電動機保護斷路器之IEC符號，此斷路器具有下列何保護功能", "opts": ["短路、延時", "短路、過載", "延時、過載", "跳脫、變頻"], "img": "img/01-55.png", "ex": "每一相都有兩種保護元件：「ㄈ」形熱動元件負責過載，「I>」瞬時電磁元件負責短路。所以保護功能是短路和過載。"}, {"sec": "01", "n": 56, "ans": 3, "stem": "閃爍電驛a接點的符號為", "opts": ["", "", "", ""], "img": null, "oimg": ["img/01-56-1.png", "img/01-56-2.png", "img/01-56-3.png", "img/01-56-4.png"], "ex": "③ 接點中間畫菱形，是閃爍電驛（Flicker Relay）a 接點的畫法。"}, {"sec": "01", "n": 57, "ans": 3, "stem": "如下圖所示為電動機保護斷路器之IEC符號，其操作方式為", "opts": ["自動切換自動跳脫", "自動切換手動跳脫", "手動切換自動跳脫", "手動切換手動跳脫"], "img": "img/01-57.png", "ex": "左邊的操作記號代表用手動切換（投入）；右邊的熱動元件與「I>」動作時會自動跳脫。所以是手動切換、自動跳脫。"}, {"sec": "01", "n": 58, "ans": 2, "stem": "如下圖所示氣壓控制閥，其型式為", "opts": ["五口三位中位全開並附手動開關", "五口三位中位全閉並附手動開關", "三口五位中位全閉並附手動開關", "三口五位中位全開並附手動開關"], "img": "img/01-58.png", "ex": "有 3 個方格，所以是 3 位；共 5 個口。中間那格各口都被「T」堵住，代表中位全閉。兩端除了電磁線圈，還有手動操作記號。"}, {"sec": "01", "n": 59, "ans": 3, "stem": "如下圖所示氣壓控制閥，其型式為", "opts": ["二口五位自動復歸", "三口五位中位全閉", "五口二位自動復歸", "五口三位中位全閉"], "img": "img/01-59.png", "ex": "有 2 個方格，所以是 2 位，共 5 個口。右邊有彈簧，代表放開後會自動復歸，也就是單邊電磁閥。"}, {"sec": "01", "n": 60, "ans": 3, "stem": "如右圖所示之符號為", "opts": ["三相三線△接法", "三相三線Y接法", "三相三線△接法，一線（相）接地", "三相四線Y接法"], "img": "img/01-60.png", "ex": "三角形代表 △ 接線，三相三線；其中一個角接到接地符號，代表一線（相）接地。"}, {"sec": "01", "n": 61, "ans": 1, "stem": "如右圖根據IEC國際標準符號所示為", "opts": ["可變電阻器", "固定電阻器", "可調自耦變壓器", "變壓器"], "img": "img/01-61.png", "ex": "電阻的長方形上加一個斜向箭頭，代表阻值可以調整，是可變電阻器。"}, {"sec": "02", "n": 1, "ans": 3, "stem": "使用中心沖的作用為", "opts": ["測距離", "鑽孔", "定位", "攻牙"], "img": null, "ex": "鑽孔前先用中心沖打出一個小凹點，讓鑽頭定位不會滑走。"}, {"sec": "02", "n": 2, "ans": 2, "stem": "水平儀的用途為", "opts": ["劃垂直線", "檢查水平度", "檢查直角度", "劃圓形"], "img": null, "ex": "水平儀是用氣泡位置檢查物體是否水平。"}, {"sec": "02", "n": 3, "ans": 1, "stem": "在配電盤箱上劃線時，可使用工具為", "opts": ["石墨筆", "銼刀", "起子", "劃線針"], "img": null, "ex": "在盤箱烤漆面上劃線要用石墨筆（鉛筆），劃線針會刮傷漆面。"}, {"sec": "02", "n": 4, "ans": 1, "stem": "使用鑽床時，調整鑽台高度使鑽頭與材料之距離約", "opts": ["10～20mm", "40～50mm", "80～90mm", "120～150mm"], "img": null, "ex": "鑽頭和材料的距離約 10～20mm。距離太遠，鑽削行程變長，也比較不穩。"}, {"sec": "02", "n": 5, "ans": 2, "stem": "欲攻M4之螺牙，其攻牙前所鑽之孔徑應為", "opts": ["2.6～2.8 φ", "3.0～3.4 φ", "3.6～3.8 φ", "4.0～4.2 φ"], "img": null, "ex": "攻牙底孔的孔徑約等於「螺紋外徑 − 螺距」。M4 的螺距是 0.7，4 − 0.7 = 3.3mm，落在 3.0～3.4 之間。"}, {"sec": "02", "n": 6, "ans": 4, "stem": "螺絲攻其第一攻、第二攻、第三攻的區別", "opts": ["牙距之大小", "牙距之深淺", "孔之大小", "倒角牙紋數之多少"], "img": null, "ex": "三支一組的螺絲攻，差別在前端倒角的牙數：第一攻倒角最多，比較好導入；第三攻最少，用來把牙攻到底。"}, {"sec": "02", "n": 7, "ans": 1, "stem": "操作砂輪機時，應配戴", "opts": ["安全眼鏡", "望遠鏡", "隱形眼鏡", "近視眼鏡"], "img": null, "ex": "砂輪機會噴出火花和碎屑，一定要戴安全眼鏡。"}, {"sec": "02", "n": 8, "ans": 2, "stem": "牙距越小其固定", "opts": ["越鬆", "越緊", "與鬆緊度無關", "越容易滑牙"], "img": null, "ex": "牙距越小（細牙），螺紋越不容易自己鬆開，所以固定越緊。"}, {"sec": "02", "n": 9, "ans": 1, "stem": "木螺絲之規格是依據下列何者而定？", "opts": ["長度", "直徑", "螺紋", "材質"], "img": null, "ex": "木螺絲的規格是依長度來分。"}, {"sec": "02", "n": 10, "ans": 3, "stem": "薄鐵板要固定器具最好採用", "opts": ["英制螺絲", "公制螺絲", "螺絲與螺母", "木螺絲"], "img": null, "ex": "薄鐵板太薄，攻不出足夠的牙數，所以用螺絲穿過再鎖上螺母固定。"}, {"sec": "02", "n": 11, "ans": 4, "stem": "以手電鑽鑽孔，當接近完成時進刀速度應", "opts": ["加快", "維持不變", "切斷電源", "減慢"], "img": null, "ex": "快鑽穿時阻力會突然變小，鑽頭容易咬住材料或讓工件跟著轉，所以進刀要減慢。"}, {"sec": "02", "n": 12, "ans": 3, "stem": "測試固定螺絲鎖緊的程度是用", "opts": ["固定扳手", "梅花扳手", "扭力扳手", "套筒扳手"], "img": null, "ex": "扭力扳手可以設定或讀出鎖緊扭力，用來確認螺絲鎖緊的程度。"}, {"sec": "02", "n": 13, "ans": 1, "stem": "平墊片之作用在", "opts": ["增加壓迫面積", "增加機械強度", "增加摩擦損", "減少摩擦損"], "img": null, "ex": "平墊片可以增加受壓的面積，把壓力分散開、保護表面。防止鬆脫是彈簧墊片的作用。"}, {"sec": "02", "n": 14, "ans": 4, "stem": "潮濕的皮膚其電阻會", "opts": ["提高", "失效", "不變", "降低"], "img": null, "ex": "皮膚潮濕時電阻會大幅降低，觸電時流過人體的電流變大，更危險。"}, {"sec": "02", "n": 15, "ans": 4, "stem": "有關工具使用規則，下列敘述何者正確？", "opts": ["可將鉛管套於扳手柄以增加力矩", "刮刀都是用單手握持的", "螺絲起子可做鑿刀使用", "禁止以甲工具代替乙工具使用"], "img": null, "ex": "每種工具都有專門用途，不可以拿甲工具代替乙工具。加長扳手柄、把起子當鑿刀用都是錯誤做法。"}, {"sec": "02", "n": 16, "ans": 1, "stem": "可測量線徑之量具為", "opts": ["測微器、線規、游標尺", "測微器、線規、卷尺", "測微器、游標尺、卷尺", "游標尺、線規、卷尺"], "img": null, "ex": "測量線徑要用精度足夠的量具：測微器、線規、游標尺。卷尺的精度不夠。"}, {"sec": "02", "n": 17, "ans": 3, "stem": "1'（呎）是幾英吋？", "opts": ["8\"", "10\"", "12\"", "16\""], "img": null, "ex": "1 呎（1'）＝ 12 吋（12\"）。"}, {"sec": "02", "n": 18, "ans": 2, "stem": "1\"（英寸）是幾 mm？", "opts": ["2.54", "25.4", "3.54", "35.4"], "img": null, "ex": "1 吋（1\"）＝ 25.4 mm。"}, {"sec": "02", "n": 19, "ans": 4, "stem": "測量光線明亮程度的儀表為", "opts": ["示波器", "頻率表", "轉速表", "照度表"], "img": null, "ex": "照度表用來測量光線亮度，單位是 lux（勒克斯）。"}, {"sec": "02", "n": 20, "ans": 2, "stem": "測量電磁接觸器之接點是否正常，不可使用", "opts": ["導通試驗器", "相序計", "三用電表", "數位三用電表"], "img": null, "ex": "相序計是用來量三相電源的相序，不能測接點是否導通。"}, {"sec": "02", "n": 21, "ans": 4, "stem": "在不通電的情況下，測量電磁接觸器之線圈是否正常，三用電表應撥在", "opts": ["DCV檔", "ACV檔", "DCmA檔", "歐姆檔"], "img": null, "ex": "在不通電的情況下量線圈，要用歐姆檔看電阻值：讀到 0Ω 代表短路，讀到 ∞ 代表斷線。"}, {"sec": "02", "n": 22, "ans": 3, "stem": "使用三用電表測量電壓時", "opts": ["需作0調整", "不必注意其為交流或直流", "將電壓檔位先調至最高檔", "不必注意指針之零點"], "img": null, "ex": "不知道電壓大概多大時，先撥到最高檔，再逐檔往下調，避免燒壞電表。"}, {"sec": "02", "n": 23, "ans": 2, "stem": "指針型電表面板上設置鏡面（刻度下方成扇形）是為了避免下列何者之誤差？", "opts": ["儀器", "人為", "環境", "電路"], "img": null, "ex": "讀數時讓指針和鏡中倒影重疊，眼睛就在正上方，可以避免視差。視差屬於人為誤差。"}, {"sec": "02", "n": 24, "ans": 1, "stem": "一般配置圖上器具位置之標示線為器具之", "opts": ["中心線", "右側邊線", "左側邊線", "底線"], "img": null, "ex": "器具配置圖上的位置標示線，是器具的中心線。"}, {"sec": "02", "n": 25, "ans": 4, "stem": "固定配電器具時", "opts": ["沒有方向性之限制", "必須向右對齊", "必須向左對齊", "依圖示及器具說明固定之"], "img": null, "ex": "固定器具時，要依照圖示和器具的說明書固定。"}, {"sec": "02", "n": 26, "ans": 4, "stem": "在DIN軌道上固定組合式端子台時，則", "opts": ["所有端台必須具相同規格", "只能裝置兩種不同規格之端子台", "只能裝置同一規格之一般端子台及不同規格之接地端子台", "必須裝末端固定板"], "img": null, "ex": "DIN 軌道上的端子台兩端要裝末端固定板，防止端子台左右滑動。"}, {"sec": "02", "n": 27, "ans": 4, "stem": "一般三用電表不能直接量測下列何者？", "opts": ["直流電壓", "交流電壓", "直流電流", "交流電流"], "img": null, "ex": "一般三用電表有直流電流檔，但沒有交流電流檔。量交流電流要用勾表。"}, {"sec": "02", "n": 28, "ans": 1, "stem": "規格為5.5-6的壓接端子，其中6字是表示", "opts": ["鎖緊用螺絲最大直徑", "端子之總長", "導線的線徑", "剝線的長度"], "img": null, "ex": "壓接端子規格 5.5-6：5.5 是適用導線的截面積 5.5mm²，6 是適用螺絲的直徑 6mm。"}, {"sec": "02", "n": 29, "ans": 1, "stem": "固定電表之螺母應使用的工具為", "opts": ["套筒起子", "尖嘴鉗", "壓接鉗", "鋼絲鉗"], "img": null, "ex": "電表背面的螺母要用套筒起子鎖。"}, {"sec": "02", "n": 30, "ans": 4, "stem": "使用起子時，則", "opts": ["一字起子刃部要磨尖", "十字起子刃部要磨尖", "十字起子可當一字起子使用", "選擇合適尺寸之起子"], "img": null, "ex": "要選尺寸合適的起子。尺寸不合會滑牙，損壞螺絲頭或起子。"}, {"sec": "02", "n": 31, "ans": 2, "stem": "使用電工刀，刀口宜向", "opts": ["內", "外", "上", "下"], "img": null, "ex": "使用電工刀時刀口要朝外，避免割傷自己。"}, {"sec": "02", "n": 32, "ans": 3, "stem": "在對金屬工作物加工時，不可注油來潤滑者為", "opts": ["鑽孔", "鉸牙", "銼刀", "鋸削"], "img": null, "ex": "銼刀不能加油，加油會打滑、齒溝也容易塞住。鑽孔、鉸牙、鋸削則可以加切削油潤滑、冷卻。"}, {"sec": "02", "n": 33, "ans": 2, "stem": "電磁開關之積熱電驛，用於保護", "opts": ["線路短路", "電動機過載", "接地", "漏電"], "img": null, "ex": "積熱電驛是用來保護電動機過載。短路保護靠斷路器或保險絲。"}, {"sec": "02", "n": 34, "ans": 4, "stem": "積熱電驛之額定電流為15A，則其過載電流調整鈕的範圍為", "opts": ["18～26A", "17～24A", "9～15A", "12～18A"], "img": null, "ex": "積熱電驛的調整範圍大約是額定電流的 0.8～1.2 倍：15A × 0.8 = 12A，15A × 1.2 = 18A。"}, {"sec": "02", "n": 35, "ans": 1, "stem": "安裝選擇開關時，則", "opts": ["必須先檢查接點是否正常", "將墊片分別置於鐵板之兩邊", "不必注意裝置角度", "將不用接線之接點螺絲取下"], "img": null, "ex": "安裝選擇開關前，要先檢查接點動作是否正常。"}, {"sec": "02", "n": 36, "ans": 1, "stem": "利用虎鉗夾持已完工之加工面，須下列何種材料作為墊片？", "opts": ["銅", "鐵", "鋼", "破布"], "img": null, "ex": "夾持已加工完成的表面時，墊片要用比較軟的銅片，避免夾傷表面。"}, {"sec": "02", "n": 37, "ans": 2, "stem": "裝置無熔線斷路器時，則", "opts": ["將斷路器置於ON位置", "將斷路器置於OFF位置", "將斷路器置於跳脫位置", "將斷路器置於ON位置且用膠布貼牢"], "img": null, "ex": "安裝無熔線斷路器時要放在 OFF 位置，避免意外送電。"}, {"sec": "02", "n": 38, "ans": 3, "stem": "裝置限制開關時，則", "opts": ["不必調整其動作距離", "不必調整其動作方向", "應配置或預留接地線", "應加裝防爆安全罩"], "img": null, "ex": "限制開關有金屬外殼，要配置或預留接地線。"}, {"sec": "02", "n": 39, "ans": 2, "stem": "電晶體組件常用的電烙鐵以", "opts": ["2～5W", "30～40W", "100～150W", "200～300W"], "img": null, "ex": "焊電晶體等電子零件，用 30～40W 的電烙鐵就夠了。瓦數太大溫度過高，會燙壞元件。"}, {"sec": "02", "n": 40, "ans": 4, "stem": "下列何者不是電氣火災發生的原因？", "opts": ["由於電荷聚集，產生靜電火花放電，引燃易燃物", "因開關啟斷時所發生的火花，引燃附近的外物", "因電路短路引起高溫", "電流流入人體"], "img": null, "ex": "電流流入人體造成的是觸電，不會引起火災。靜電火花、開關火花、短路高溫都可能造成火災。"}, {"sec": "02", "n": 41, "ans": 3, "stem": "電動機、變壓器等設備所引起火災屬於", "opts": ["A類", "B類", "C類", "D類"], "img": null, "ex": "火災分類：A 類是一般可燃物，B 類是油類，C 類是電氣火災，D 類是金屬火災。電動機、變壓器屬於 C 類。"}, {"sec": "02", "n": 42, "ans": 2, "stem": "電烙鐵用完後，應進行下列何項安全步驟？", "opts": ["不必拔掉電源", "拿住插頭拔除電源", "直接握住電烙鐵用力拉離電源即可", "拿住電源線把插頭拉下"], "img": null, "ex": "拔電源時要拿住插頭拔。拉電線容易把線拉斷或拉鬆。"}, {"sec": "02", "n": 43, "ans": 2, "stem": "配電盤箱做自主檢查時，當操作電氣控制開關前應注意事項為", "opts": ["不必顧慮後端負載情況", "須先確認配電盤箱輸入電源電壓及切離負載", "每次均需重覆操作幾次以確保開關動作確實", "須先投入負載"], "img": null, "ex": "操作開關前，要先確認輸入電源電壓，並切離負載，避免負載誤動作。"}, {"sec": "02", "n": 44, "ans": 4, "stem": "遇有電氣事故所引起的火災，在未切斷電源前，不宜使用", "opts": ["滅火砂", "二氧化碳滅火器", "乾粉滅火器", "水"], "img": null, "ex": "水會導電，沒切斷電源前用水滅火會觸電。"}, {"sec": "02", "n": 45, "ans": 1, "stem": "危險場所的各接線盒、燈具及金屬管接頭必須用螺紋接合，且為", "opts": ["防爆型", "防塵型", "防水型", "隔音型"], "img": null, "ex": "危險場所有易燃氣體，接線盒、燈具和管接頭都要用防爆型。"}, {"sec": "02", "n": 46, "ans": 4, "stem": "選擇滅火器材是依下列何者而定？", "opts": ["起火點", "風向", "氣候", "燃燒物"], "img": null, "ex": "滅火器要依燃燒物的種類（A、B、C、D 類）來選。"}, {"sec": "02", "n": 47, "ans": 4, "stem": "有關防止易燃氣體爆炸之方法，下列敘述何者錯誤？", "opts": ["防止洩漏", "防止溫度過高", "遠離火種", "減少通風效果"], "img": null, "ex": "防止易燃氣體爆炸要加強通風。「減少通風」會讓氣體累積，所以是錯的。"}, {"sec": "02", "n": 48, "ans": 2, "stem": "低壓接觸型驗電筆會亮代表", "opts": ["電源電壓異常", "電流通過人體", "電源漏電", "電路電壓失常"], "img": null, "ex": "接觸型驗電筆會亮，是因為有微小電流經過人體流到地，形成迴路。"}, {"sec": "02", "n": 49, "ans": 2, "stem": "人體的電阻比正常接地電阻為", "opts": ["小", "大", "因人而異", "因地而異"], "img": null, "ex": "人體電阻約數千 Ω，遠大於接地電阻（數十 Ω 以下）。所以漏電時，電流大部分會經接地線流走。"}, {"sec": "02", "n": 5     <label class="sw"><input type="checkbox" id="shuf" ${cfg.shuf?'checked':''}>選項順序也打亂（防止背「答案是 ③」）</label>
  </div>
  <button class="go" id="go"><span class="lamp g"></span>開始 · ${cfg.mode=='wrong'?wrongs().filter(q=>cfg.secs.includes(q.sec)).length:cfg.mode=='exam'?Math.min(cfg.n,n):n} 題</button>
  <div class="foot">版本 1.5· 作答紀錄只存在這台裝置的瀏覽器裡。<br><button class="link" id="reset">清除作答紀錄</button></div>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s;cfg.secs=cfg.secs.includes(k)?cfg.secs.filter(x=>x!=k):[...cfg.secs,k].sort();if(!cfg.secs.length){cfg.secs=[k];toast('至少要選一個工作項目')}persist();home()});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.m;persist();home()});
  const nr=$('#nr');if(nr)nr.oninput=()=>{cfg.n=+nr.value;$('#nv').textContent=cfg.n+' 題';$('#go').lastChild.textContent='開始 · '+cfg.n+' 題';persist()};
  $('#shuf').onchange=e=>{cfg.shuf=e.target.checked;persist()};
  $('#auto').onchange=e=>{cfg.auto=e.target.checked;persist()};
  $('#go').onclick=start;
  $('#reset').onclick=async()=>{if(await ask('確定清除所有作答紀錄與錯題本？')){store.s={};save();home()}};
}

function start(){
  let qs;
  if(cfg.mode=='wrong'){qs=shuffle(wrongs().filter(q=>cfg.secs.includes(q.sec)));if(!qs.length){toast('這個範圍的錯題本是空的');return}}
  else if(cfg.mode=='seq') qs=pool();
  else if(cfg.mode=='random') qs=shuffle(pool());
  else qs=shuffle(pool()).slice(0,cfg.n);
  S={mode:cfg.mode,qs:qs.map(q=>({q,order:(cfg.shuf&&!q.oimg)?shuffle([0,1,2,3]):[0,1,2,3],pick:null})),i:0};
  show();
}

function show(){
  clearTimeout(S.timer);S.timer=null;
  const it=S.qs[S.i], q=it.q, s=SEC[q.sec], exam=S.mode=='exam';
  const answered=it.pick!==null, reveal=answered&&!exam;
  const right=S.qs.filter(x=>x.pick!==null&&x.pick===x.q.ans-1).length, ans=S.qs.filter(x=>x.pick!==null).length;
  const last=S.i==S.qs.length-1;
  app.innerHTML=`
  <div class="qtop"><button class="btn" id="back">← 首頁</button>
    ${exam?'':`<button class="chip-t ${cfg.auto?'on':''}" id="autoT" aria-pressed="${cfg.auto}">答對自動跳 ${cfg.auto?'開':'關'}</button>`}<span class="score">${exam?`已作答 <b class="num">${ans}</b>/${S.qs.length}`:`答對 <b class="num">${right}</b> / ${ans}`}</span></div>
  <div class="bar"><i style="width:${(S.i+1)/S.qs.length*100}%"></i></div>
  <article class="qcard" style="--c:${s.c}">
    <div class="qmeta"><span class="pill"><i></i>工作項目 ${q.sec} · ${s.name}</span><span class="num" style="font-size:15px">${S.i+1} / ${S.qs.length}</span></div>
    <div class="qmeta" style="margin-top:-4px"><span>題庫第 ${q.n} 題</span>${st(q).w?`<span style="color:var(--amb)">曾答錯 ${st(q).w} 次</span>`:''}</div>
    <div class="stem">${esc(q.stem)}</div>
    ${q.img?`<div class="fig"><img src="${q.img}" alt="題目附圖"><small>題目附圖</small></div>`:''}
    <div class="opts">${it.order.map((oi,pos)=>{
      let c='';if(reveal){if(oi===q.ans-1)c='ok';else if(oi===it.pick)c='bad'}else if(exam&&oi===it.pick)c='pick';
      return `<button class="opt ${c}" data-o="${oi}" ${reveal?'disabled':''}><span class="k">${pos+1}</span>${q.oimg?`<img class="oimg" src="${q.oimg[oi]}" alt="選項${pos+1}">`:`<span>${esc(q.opts[oi])}</span>`}</button>`}).join('')}</div>
    ${reveal?`<div class="fb ${it.pick===q.ans-1?'ok':'bad'}">${it.pick===q.ans-1?'✔ 答對了':'✘ 答錯，正確答案是第 '+(it.order.indexOf(q.ans-1)+1)+' 個選項，已加入錯題本'}</div>${q.ex?`<div class="ex"><b>詳解</b>${esc(q.ex)}</div>`:''}`:''}
    ${exam&&!answered?`<div class="hint">模擬測驗不會馬上對答案，交卷後一起看。</div>`:''}
  </article>
  <div class="hint">電腦可用鍵盤：1–4 作答、Enter 下一題、← 上一題</div>`;
  $('#back').onclick=async()=>{if(S.mode!='exam'||await ask('離開會放棄這次測驗，確定？'))home()};
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  const at=$('#autoT');if(at)at.onclick=()=>{cfg.auto=!cfg.auto;persist();if(!cfg.auto)clearTimeout(S.timer);at.classList.toggle('on',cfg.auto);at.textContent='答對自動跳 '+(cfg.auto?'開':'關');at.setAttribute('aria-pressed',cfg.auto)};
  dock.classList.remove('hide');
  dockIn.innerHTML=`<button class="btn" id="prev" ${S.i?'':'disabled'}>上一題</button>
   ${exam?`<button class="btn" id="fin">交卷</button>`:''}
   <button class="btn pri" id="next" ${(!exam&&!answered)?'disabled':''}>${last?(exam?'交卷':'看結果'):'下一題 →'}</button>`;
  $('#prev').onclick=()=>{S.i--;show()};
  const submit=async()=>{const left=S.qs.filter(x=>x.pick===null).length;if(!left||await ask(`還有 ${left} 題沒作答，確定交卷？`))finish()};
  $('#next').onclick=()=>{if(last){exam?submit():finish()}else{S.i++;show()}};
  if(exam)$('#fin').onclick=submit;
  window.scrollTo(0,0);
}

function record(q,ok){
  const s=store.s[q.id]=store.s[q.id]||{c:0,w:0,wb:false};
  if(ok){s.c++;if(S.mode=='wrong')s.wb=false}else{s.w++;s.wb=true}
  save();
}
function pick(oi){
  const it=S.qs[S.i];
  if(S.mode=='exam'){it.pick=oi;show();return}
  if(it.pick!==null)return;
  it.pick=oi;const ok=oi===it.q.ans-1;record(it.q,ok);show();
  if(ok&&cfg.auto&&S.i<S.qs.length-1){S.i++;show();flash();return}
  const f=document.querySelector('.ex')||document.querySelector('.fb');if(f)f.scrollIntoView({block:'center',behavior:'smooth'});
}
function finish(){
  if(S.mode=='exam')S.qs.forEach(it=>record(it.q,it.pick===it.q.ans-1));
  const n=S.qs.length, r=S.qs.filter(x=>x.pick===x.q.ans-1).length, score=Math.round(r/n*100);
  const miss=S.qs.filter(x=>x.pick!==x.q.ans-1);
  const secs=[...new Set(S.qs.map(x=>x.q.sec))].sort();
  dock.classList.add('hide');
  const title={seq:'依序練習',random:'隨機刷題',exam:'模擬測驗',wrong:'錯題本'}[S.mode];
  app.innerHTML=`
  <div class="qtop"><button class="btn" id="back">← 首頁</button><span class="score">${title}</span></div>
  <section class="res">
    <div class="mut">${S.mode=='exam'?'測驗成績':'這一輪的得分'}</div>
    <div class="big num" style="color:${score>=60?'#6fe39a':'#ff8a7a'}">${score}</div>
    <div>答對 ${r} / ${n} 題${S.mode=='exam'?(score>=60?' · 及格':' · 未達 60 分及格線'):''}</div>
    ${secs.length>1?`<div class="bysec">${secs.map(k=>{const a=S.qs.filter(x=>x.q.sec==k),b=a.filter(x=>x.pick===x.q.ans-1).length;return `<div style="--c:${SEC[k].c}">工作項目 ${k}<b class="num">${b}/${a.length}</b></div>`}).join('')}</div>`:''}
    <div class="row"><button class="btn pri" id="again">再來一輪</button>${miss.length?`<button class="btn" id="redo">只重做錯的 ${miss.length} 題</button>`:''}</div>
  </section>
  ${miss.length?`<h2>錯題檢討</h2><p class="lead">這些題目都已經加入錯題本。</p>${miss.map(it=>{const q=it.q;return `<div class="rv" style="--c:${SEC[q.sec].c}">
    <div class="qmeta"><span class="pill"><i></i>${q.sec}-${q.n}</span></div>
    <div class="q">${esc(q.stem)}</div>
    ${q.img?`<div class="fig" style="margin:8px 0"><img src="${q.img}" alt=""></div>`:''}
    <div class="a mine">你的答案：${it.pick===null?'未作答':oh(q,it.pick)}</div>
    <div class="a right">正確答案：${oh(q,q.ans-1)}</div>${q.ex?`<div class="ex"><b>詳解</b>${esc(q.ex)}</div>`:''}</div>`}).join('')}`:`<p class="lead" style="text-align:center;margin-top:16px">全對，沒有錯題。</p>`}`;
  $('#back').onclick=home;$('#again').onclick=start;
  if(miss.length)$('#redo').onclick=()=>{S={mode:S.mode=='exam'?'random':S.mode,qs:shuffle(miss).map(it=>({q:it.q,order:it.order,pick:null})),i:0};show()};
  window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!S||dock.classList.contains('hide')||document.querySelector('.modal'))return;
  const it=S.qs[S.i];
  if(['1','2','3','4'].includes(e.key))pick(it.order[+e.key-1]);
  else if(e.key=='Enter'||e.key=='ArrowRight'){const n=$('#next');if(n&&!n.disabled)n.click()}
  else if(e.key=='ArrowLeft'){const p=$('#prev');if(p&&!p.disabled)p.click()}
});
home();
}
</script>
</body>
</html>
