<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工業配線丙級 學科刷題</title>
<meta name="theme-color" content="#1f2a33">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 工場盤箱的實用感，清楚、穩、好按
   IDEA: 配電盤面板 — 深色盤面、銘板、指示燈
   PICTURE: 首頁上方的盤面儀表區（三顆指示燈＋三個計數）
   COLOUR: 盤面深灰 + RAL7035 淺灰底，指示燈綠/紅/黃，各工作項目各一色
   TYPE: Noto Sans TC 內文、Barlow Condensed 數字；LAYOUT: 單欄，手機優先 */
:root{color-scheme:light dark;
--bg:light-dark(#e9ebe8,#0f1418);--card:light-dark(#ffffff,#192127);--ink:light-dark(#1a2228,#e6eaec);--mut:light-dark(#5d6970,#93a1a8);--line:light-dark(#d4d9d6,#2a343b);
--panel:#1f2a33;--panel2:#2a3742;--plate:#eef0ec;
--ok:#1f9d55;--okbg:light-dark(#e3f5ea,#123222);--bad:#d64535;--badbg:light-dark(#fbe6e3,#3a1714);--amb:#f0a020;
--s01:#2f74c0;--s02:#d4801a;--s03:#159a8c;--s04:#7a5cc7;--s05:#c2477d;--s06:#5f8a2a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip}
.num{font-family:"Barlow Condensed","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}

/* 盤面 */
.panel{background:var(--panel);color:#e8ecee;padding:22px 18px 20px;margin:0 -16px 0;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
@media(min-width:792px){.panel{margin:0;border-radius:0 0 22px 22px}}
.panel::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.025) 46px 47px);pointer-events:none}
.screws{position:absolute;inset:10px;pointer-events:none}
.screws i{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8a979f,#47535b);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.screws i:nth-child(1){left:0;top:0}.screws i:nth-child(2){right:0;top:0}
.badge{display:inline-block;font-size:12px;background:#f0a020;color:#1f2a33;font-weight:700;border-radius:4px;padding:1px 8px;margin-bottom:8px}
.panel h1{margin:0;font-size:clamp(26px,6vw,36px);line-height:1.12;font-weight:900;letter-spacing:.5px;text-wrap:balance}
.panel .sub{color:#a9b6bd;font-size:13.5px;margin-top:6px}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px;position:relative}
.meter{background:var(--panel2);border-radius:14px;padding:12px 12px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 rgba(0,0,0,.25)}
.lamp{width:14px;height:14px;border-radius:50%;margin-bottom:8px;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.lamp.g{background:radial-gradient(circle at 35% 35%,#9ff0bd,#1f9d55 60%);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 12px #1f9d5599}
.lamp.y{background:radial-gradient(circle at 35% 35%,#ffe2a0,#f0a020 60%);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 12px #f0a02099}
.lamp.r{background:radial-gradient(circle at 35% 35%,#ffb4aa,#d64535 60%);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 12px #d6453599}
.lamp.off{background:#3a4650;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.meter b{display:block;font-size:30px;line-height:1;color:#fff}
.meter b small{font-size:16px;color:#8fa0a8}
.meter span{font-size:12.5px;color:#a9b6bd}

h2{font-size:19px;margin:28px 2px 4px;font-weight:700}
.lead{color:var(--mut);font-size:14px;margin:0 2px 12px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px}
.step b{display:block;font-size:22px;line-height:1;color:var(--amb)}
@media(max-width:520px){.rng{padding-left:14px}.steps{grid-template-columns:1fr}.step{display:flex;gap:10px;align-items:baseline}}

/* 銘板（工作項目） */
.secs{display:flex;flex-direction:column;gap:10px}
.sec{border-radius:16px;border:2px solid var(--line);background:var(--card)}
.secHit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;width:100%;padding:14px;border:0;background:none;cursor:pointer;border-radius:14px}
.rng{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 14px 14px 72px;font-size:14px;color:var(--mut)}
.rng input{width:72px;min-height:40px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--bg);color:var(--ink);text-align:center}
.rng input:focus{border-color:var(--c);outline:none}
.rng .full{border:0;background:none;color:var(--c);font-weight:700;cursor:pointer;padding:6px}
.rng.cust{color:var(--ink)}
.rng.cust b{color:var(--c)}
.prs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.pr{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px}
.pr.on{border-color:var(--ink);font-weight:700}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}
.zoom img{width:100%;max-width:960px;height:auto;max-height:100%;object-fit:contain;background:#fff;border-radius:10px;padding:8px}
.fig img{cursor:zoom-in}
sup,sub{font-size:.72em;line-height:0}
.sec .no{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:700}
.sec h3{margin:0;font-size:16.5px;line-height:1.3}
.sec p{margin:3px 0 8px;color:var(--mut);font-size:13.5px;line-height:1.55}
.sec .tip{font-size:12.5px;color:var(--ink);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:8px;padding:4px 8px;display:inline-block}
.sec .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:#fff}
.sec.on{border-color:var(--c)}
.sec.on .ck{background:var(--c);border-color:var(--c)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-top:8px}
.prog .tr{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--c)}

/* 模式 */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{text-align:left;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.mode b{display:block;font-size:16px}
.mode span{display:block;color:var(--mut);font-size:13px;line-height:1.5;margin-top:2px}
.mode.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opts-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.sw{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer;min-height:36px}
.sw input{width:20px;height:20px;accent-color:var(--panel)}
input[type=range]{width:100%;accent-color:var(--amb)}
.go{width:100%;margin-top:16px;padding:16px;border-radius:16px;border:0;background:var(--panel);color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 3px 0 #0b1015}
.go .lamp{margin:0}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1015}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:22px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13px;padding:8px}

/* 做題 */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer;min-height:44px}
.btn.pri{background:var(--panel);color:#fff;border-color:var(--panel);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{background:#f0a020;border-color:#f0a020;color:#1f2a33}}
:root[data-theme=dark] .btn.pri{background:#f0a020;border-color:#f0a020;color:#1f2a33}
.score{font-size:14px;color:var(--mut)}
.score b{color:var(--ink);font-size:18px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--amb);transition:width .2s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;border-top:5px solid var(--c)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--c)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stem{font-size:18.5px;line-height:1.6;margin:4px 0 14px;font-weight:500}
.fig{background:#fff;border-radius:12px;padding:10px;margin-bottom:14px;border:1px solid var(--line);text-align:center}
.fig img{max-width:100%;max-height:220px;width:auto;height:auto;display:block;margin:0 auto}
.fig small{display:block;color:#6b7780;font-size:12px;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:16.5px;cursor:pointer;min-height:54px}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:15px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .k{background:var(--bad);color:#fff}
.opt.pick{border-color:var(--panel)}.opt.pick .k{background:var(--panel);color:#fff}
.opt:disabled{cursor:default}
.oimg{max-height:76px;max-width:78%;background:#fff;border-radius:8px;padding:4px}
.oimg.sm{max-height:44px;vertical-align:middle}
.fb{margin-top:14px;padding:10px 12px;border-radius:12px;font-weight:700;display:flex;gap:8px;align-items:center}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.ex{margin-top:10px;padding:12px 14px;border-radius:12px;background:light-dark(#f3f5f2,#141b20);border-left:4px solid var(--amb);font-size:15px;line-height:1.7}
.ex b{display:block;font-size:13px;color:var(--amb);margin-bottom:2px}
.presets{display:flex;gap:8px;margin:6px 0 4px}.pre{flex:1;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}.pre.on{border-color:var(--amb);color:var(--amb)}.pre:disabled{opacity:.35;cursor:default}
.chip-t{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13.5px;cursor:pointer;min-height:36px;margin-left:auto}
.chip-t.on{border-color:var(--ok);color:var(--ok);font-weight:700}
.fb{flex-wrap:wrap;position:relative;overflow:hidden}
.stay{margin-left:auto;border:0;background:var(--ok);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:40px}
.cd{position:absolute;left:0;bottom:0;height:3px;width:100%}.cd i{display:block;height:100%;background:var(--ok);animation:cd 1.2s linear forwards}@keyframes cd{from{width:100%}to{width:0}}
.flash{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:700;padding:6px 16px;border-radius:99px;z-index:9;font-size:15px;pointer-events:none}
.hint{color:var(--mut);font-size:12.5px;text-align:center;margin-top:10px}
.dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between}
.dock .btn{flex:1}.dock .btn.pri{flex:1.6}

/* 結果 */
.res{background:var(--panel);color:#fff;border-radius:20px;padding:22px;text-align:center;margin-top:8px}
.res .big{font-size:72px;line-height:1;font-weight:700}
.res .mut{color:#a9b6bd}
.res .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.res .btn{background:var(--panel2);color:#fff;border-color:transparent}
.res .btn.pri{background:#f0a020;color:#1f2a33;border-color:#f0a020}
.bysec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;text-align:left}
.bysec div{background:var(--panel2);border-radius:12px;padding:8px 10px;font-size:12.5px;color:#a9b6bd;border-left:4px solid var(--c)}
.bysec b{display:block;color:#fff;font-size:20px}
.rv{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rv .q{font-weight:500}
.rv .a{font-size:14px;margin-top:6px}
.rv .a.mine{color:var(--bad)}.rv .a.right{color:var(--ok);font-weight:700}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.mbox{background:var(--card);border-radius:18px;padding:20px;max-width:360px;width:100%}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--panel);color:#fff;padding:10px 18px;border-radius:99px;z-index:9;font-size:14px}
@media(min-width:1000px){
 .wrap.is-home{max-width:1160px}
 .is-home .panel{border-radius:0 0 26px 26px;padding:30px 32px 26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:end}
 .is-home .panel .meters{margin-top:0}
 .is-home .panel h1{font-size:44px}
 .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
 .colB{position:sticky;top:16px}
 .wrap.is-q{max-width:820px}
 .is-q .stem{font-size:20px}
 .is-q .opt{font-size:17px}
 .is-q .fig img{max-height:260px}
}
@media (prefers-reduced-motion:no-preference){.lamp.g,.lamp.y{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{filter:brightness(1.18)}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="dock hide" id="dock"><div class="in" id="dockIn"></div></div>
<script>
{
const DATA = {"sections":{"01":"識圖與繪圖","02":"電氣器具之裝置","03":"電氣器具之使用","04":"主電路裝配","05":"控制電路裝配","06":"檢查及故障排除"},"questions":[{"sec":"01","n":1,"ans":1,"stem":"如下圖所示，IEC國際標準符號為","opts":["有機械連鎖之電驛線圈","沒有機械連鎖之電驛線圈","接於直流之電驛線圈","接於交流之電驛線圈"],"img":"img/01-001.png","ex":"一般電驛線圈只是單純的長方框（見第 11 題）。這題方框旁多一個附加格，裡面是閂鎖記號，表示電驛帶有機械連鎖（閂鎖）機構。"},{"sec":"01","n":2,"ans":4,"stem":"如下圖所示，IEC國際標準符號為","opts":["有機械連鎖之電驛線圈","沒有機械連鎖之電驛線圈","接於直流之電驛線圈","接於交流之電驛線圈"],"img":"img/01-002.png","ex":"線圈方框旁的附加格畫「∿」正弦波，代表線圈接交流電源。如果是直流，附加格會畫「—」。"},{"sec":"01","n":3,"ans":4,"stem":"如下圖所示，IEC國際標準符號為","opts":["有機械連鎖之常閉接點","能延時動作的常閉接點","極限開關的常開接點","極限開關的常閉接點"],"img":"img/01-003.png","ex":"接點平時閉合，是常閉接點。刀片上有直角三角形凸塊，表示接點是被機械凸輪或擋塊碰觸而動作，也就是極限（限制）開關。"},{"sec":"01","n":4,"ans":2,"stem":"如下圖所示，IEC國際標準符號為","opts":["有機械連鎖之常開接點","能延時復歸的常開接點","常開接點","常閉接點"],"img":"img/01-004.png","ex":"這是常開接點，刀片上加了圓弧（降落傘形）延時記號。題庫答案是「能延時復歸」，也就是斷電延時的常開接點。它跟第 52、53 題的通電延時記號樣式不同，要分開記。"},{"sec":"01","n":5,"ans":3,"stem":"如下圖所示，IEC國際標準符號為","opts":["有機械連鎖之常開接點","能延時動作的常開接點","按鈕開關的常開接點","按鈕開關的常閉接點"],"img":"img/01-005.png","ex":"常開接點加一條虛線（機械連動）連到「ㄒ」形按壓頭，代表用手按壓操作，所以是按鈕開關的常開接點。"},{"sec":"01","n":6,"ans":4,"stem":"如下圖所示，IEC國際標準符號為","opts":["有機械連鎖之常閉接點","能延時動作的常閉接點","緊急停止用之常開接點","緊急停止用之常閉接點"],"img":"img/01-006.png","ex":"操作頭是蘑菇頭（菇形），代表緊急停止按鈕。接點平時閉合，是常閉接點。緊急停止一定用 b 接點，按下就切斷電路。"},{"sec":"01","n":7,"ans":1,"stem":"如下圖所示，IEC國際標準符號為","opts":["拉動以啟閉之常閉接點","轉動以啟閉之常閉接點","能延時動作之常閉接點","緊急停止用之常閉接點"],"img":"img/01-007.png","ex":"接點平時閉合（常閉）。操作記號跟按鈕的「ㄒ」形、旋轉的階梯形都不同，這是「拉動」操作的記號。"},{"sec":"01","n":8,"ans":2,"stem":"如下圖所示，IEC國際標準符號為","opts":["拉動以啟閉之常開接點","轉動以啟閉之常開接點","能延時動作之常開接點","緊急停止用之常開接點"],"img":"img/01-008.png","ex":"常開接點，操作記號是階梯（ㄣ）形，代表旋轉操作，例如選擇開關、旋鈕。"},{"sec":"01","n":9,"ans":4,"stem":"如下圖所示，IEC國際標準符號為","opts":["指示燈","電阻","線圈","蜂鳴器"],"img":"img/01-009.png","ex":"IEC 符號中，半圓碗形加兩條引線是蜂鳴器；指示燈是圓圈內打叉（見第 10 題）。"},{"sec":"01","n":10,"ans":2,"stem":"如下圖所示，IEC國際標準符號為","opts":["蜂鳴器","能閃爍的指示燈","接交流電之電磁鐵","接於交流之電驛線圈"],"img":"img/01-010.png","ex":"圓圈內打叉是指示燈，旁邊再加一個方波（脈波）記號，表示會閃爍。"},{"sec":"01","n":11,"ans":3,"stem":"如下圖所示，IEC國際標準符號為","opts":["指示燈","蜂鳴器","電驛之線圈","栓型保險絲"],"img":"img/01-011.png","ex":"單純的長方框加上下引線，是 IEC 電驛（接觸器）線圈的一般符號。"},{"sec":"01","n":12,"ans":4,"stem":"線圈符號旁加註TC者為","opts":["投入線圈","動作線圈","記憶線圈","跳脫線圈"],"img":null,"ex":"TC 是 Trip Coil，跳脫線圈，用在斷路器跳脫。投入線圈是 CC（Closing Coil）。"},{"sec":"01","n":13,"ans":2,"stem":"左圖所示之符號為","opts":["電磁電驛線圈","感應電動機","同步電動機","交流電流表"],"img":"img/01-013.png","ex":"圓圈內 M 代表電動機（Motor），IM 是 Induction Motor，感應電動機。同步電動機標 SM。"},{"sec":"01","n":14,"ans":3,"stem":"如左圖所示之符號為","opts":["交流電動機","直流電動機","直流發電機","交流發電機"],"img":"img/01-014.png","ex":"G 是發電機（Generator），G 下方畫直線「—」代表直流，所以是直流發電機。電動機用 M。"},{"sec":"01","n":15,"ans":2,"stem":"如左圖所示之符號為","opts":["直流發電機","交流發電機","直流電動機","接地電壓表"],"img":"img/01-015.png","ex":"G 下方畫「～」代表交流，所以是交流發電機。可以跟第 14 題對照記。"},{"sec":"01","n":16,"ans":1,"stem":"如下圖所示之符號為","opts":["繞線型感應電動機","鼠籠型感應電動機","感應發電機","同步發電機"],"img":"img/01-016.png","ex":"IM 外面是雙圓，而且下方另有三條引線（經滑環從轉子引出），這是繞線型感應電動機。鼠籠型的轉子是短路的，沒有引出線。"},{"sec":"01","n":17,"ans":2,"stem":"零相比流器之符號為","opts":["","","",""],"img":null,"oimg":["img/01-017-1.png","img/01-017-2.png","img/01-017-3.png","img/01-017-4.png"],"ex":"零相比流器（ZCT）是讓三相導線一起穿過同一個鐵心，用來偵測漏電（零相）電流。② 就是三條線一起穿過鐵心的畫法。"},{"sec":"01","n":18,"ans":1,"stem":"如左圖所示之符號為","opts":["無效功率表","有效功率表","視在電力表","功因表"],"img":"img/01-018.png","ex":"VAR 是無效功率的單位（乏），所以是無效功率表。有效功率表標 W，視在功率的單位是 VA。"},{"sec":"01","n":19,"ans":3,"stem":"如左圖所示之符號為","opts":["功率表","瓦時表","功率因數表","無效功因表"],"img":"img/01-019.png","ex":"PF 是 Power Factor，功率因數表。"},{"sec":"01","n":20,"ans":2,"stem":"如左圖所示之符號為","opts":["電流表","伏特表","功因表","瓦特表"],"img":"img/01-020.png","ex":"圓圈內 V 是電壓表（伏特表）。電流表標 A，瓦特表標 W。"},{"sec":"01","n":21,"ans":1,"stem":"下列符號何者為電解質電容器？","opts":["","","",""],"img":null,"oimg":["img/01-021-1.png","img/01-021-2.png","img/01-021-3.png","img/01-021-4.png"],"ex":"① 有標「＋」極性，而且一邊極板是塗黑（或斜線）的，表示有極性的電解質電容器。②～④ 是一般或其他電容畫法。"},{"sec":"01","n":22,"ans":4,"stem":"如左圖所示之符號為","opts":["紅色指示燈","白色指示燈","黃色指示燈","綠色指示燈"],"img":"img/01-022.png","ex":"圓圈內打叉是指示燈，中間的字母代表顏色：G＝Green 綠色。另外 R 是紅、Y 是黃、W 是白。"},{"sec":"01","n":23,"ans":3,"stem":"如左圖所示之符號為","opts":["單極單投開關","三極雙投開關","三極單投開關","單極雙投開關"],"img":"img/01-023.png","ex":"動片上有三條短斜線，代表三極；只有一個投入位置，代表單投。合起來是三極單投開關。"},{"sec":"01","n":24,"ans":4,"stem":"下列何者為雙極雙投之開關符號？","opts":["","","",""],"img":null,"oimg":["img/01-024-1.png","img/01-024-2.png","img/01-024-3.png","img/01-024-4.png"],"ex":"④ 兩組接點用虛線連動，代表雙極；每組都有兩個可以投入的位置，代表雙投。"},{"sec":"01","n":25,"ans":3,"stem":"如下圖所示之符號為","opts":["電磁開關b接點","電磁開關a接點","按鈕開關a接點","按鈕開關b接點"],"img":"img/01-025.png","ex":"這是 CNS 畫法：兩個接點圓上方有橫桿，橫桿上有按壓記號，平時打開，所以是按鈕開關 a 接點。"},{"sec":"01","n":26,"ans":2,"stem":"如下圖所示之符號為","opts":["通電延時動作電驛a接點","斷電延時復歸電驛a接點","手動復歸b接點","殘留a接點"],"img":"img/01-026.png","ex":"CNS 畫法中，接點旁的三角形「△」是延時記號。依題庫，這個畫法是斷電延時復歸電驛的 a 接點。"},{"sec":"01","n":27,"ans":3,"stem":"如下圖所示之符號為","opts":["a接點","b接點","熱動a接點","限時復歸a接點"],"img":"img/01-027.png","ex":"接點旁打「×」是積熱電驛（熱動）接點的 CNS 畫法。這個接點平時打開，所以是熱動 a 接點。"},{"sec":"01","n":28,"ans":2,"stem":"如左圖所示之符號為","opts":["限時動作接點","殘留接點","手捺開關接點","自動復歸接點"],"img":"img/01-028.png","ex":"按鈕橫桿上方多一個勾形記號，這是殘留接點：動作後會保持，不會自動復歸。"},{"sec":"01","n":29,"ans":1,"stem":"限制開關（Limit Switch）之常開接點（N.O）符號為","opts":["","","",""],"img":null,"oimg":["img/01-029-1.png","img/01-029-2.png","img/01-029-3.png","img/01-029-4.png"],"ex":"① 接點上方有一個長方形擋塊，代表接點由機械碰觸動作，也就是限制開關（LS）；接點平時打開，所以是常開接點。"},{"sec":"01","n":30,"ans":2,"stem":"如左圖所示之符號為何種開關之接點？","opts":["按鈕開關","限制開關","光電開關","切換開關"],"img":"img/01-030.png","ex":"長方形擋塊壓在接點上方，是限制開關的接點。可以跟第 29 題一起記。"},{"sec":"01","n":31,"ans":1,"stem":"自動電壓調節器之英文縮寫符號為","opts":["AVR","PCB","ACB","OCB"],"img":null,"ex":"AVR＝Automatic Voltage Regulator，自動電壓調節器。PCB 是印刷電路板，ACB 是空氣斷路器，OCB 是油斷路器。"},{"sec":"01","n":32,"ans":3,"stem":"避雷器之英文縮寫為","opts":["RC","SC","LA","TB"],"img":null,"ex":"LA＝Lightning Arrester，避雷器。"},{"sec":"01","n":33,"ans":1,"stem":"接線端子台的英文縮寫符號為","opts":["TB","PB","ACB","COS"],"img":null,"ex":"TB＝Terminal Block，端子台。PB 是按鈕開關，COS 是切換開關。"},{"sec":"01","n":34,"ans":4,"stem":"限制開關的英文縮寫符號為","opts":["BS","PS","SS","LS"],"img":null,"ex":"LS＝Limit Switch，限制開關。BS 是按鈕開關，PS 是壓力開關，SS 是選擇開關。"},{"sec":"01","n":35,"ans":4,"stem":"直流的英文縮寫符號為","opts":["AC","BC","CC","DC"],"img":null,"ex":"DC＝Direct Current，直流。AC＝Alternating Current，交流。"},{"sec":"01","n":36,"ans":1,"stem":"如下圖所示之符號為","opts":["按鈕開關接點","限制開關接點","閃爍電驛接點","限時電驛接點"],"img":"img/01-036.png","ex":"接點上方有按壓桿記號，是 CNS 的按鈕開關接點畫法。"},{"sec":"01","n":37,"ans":2,"stem":"電路圖中，如下圖所示之符號為","opts":["電阻器","積熱電驛","熱敏電阻","輔助電驛"],"img":"img/01-037.png","ex":"TH-RY＝Thermal Relay，積熱電驛。圖形是電驛裡串在主電路上的加熱元件。"},{"sec":"01","n":38,"ans":2,"stem":"如下圖所示之符號為","opts":["電磁開關a接點","電磁開關b接點","按鈕開關a接點","按鈕開關b接點"],"img":"img/01-038.png","ex":"直線上兩條平行短線代表接點，再加一條斜線表示 b 接點（常閉）。沒有按壓或碰觸記號，所以是電磁開關（電驛）本身的 b 接點。"},{"sec":"01","n":39,"ans":2,"stem":"變壓器之符號為","opts":["","","",""],"img":null,"oimg":["img/01-039-1.png","img/01-039-2.png","img/01-039-3.png","img/01-039-4.png"],"ex":"② 是兩組線圈中間夾著平行直線（代表鐵心），這是變壓器。有斜箭頭的是可調元件。"},{"sec":"01","n":40,"ans":2,"stem":"如下圖所示之符號為","opts":["可調電阻器","可調自耦變壓器","電鈴","蜂鳴器"],"img":"img/01-040.png","ex":"線圈上有箭頭滑動接觸，可以改變匝數，這是可調自耦變壓器（俗稱 Slidac）。"},{"sec":"01","n":41,"ans":4,"stem":"電子裝置中，圖中符號表示","opts":["電晶體","整流二極體","放大器","穩壓二極體"],"img":"img/01-041.png","ex":"二極體的陰極那條橫棒兩端彎折，是稽納二極體，也就是穩壓二極體。整流二極體的陰極是直棒。"},{"sec":"01","n":42,"ans":1,"stem":"如左圖所示之符號為","opts":["保險絲","電阻","線圈","電驛"],"img":"img/01-042.png","ex":"IEC 符號中，長方形中間被一條線貫穿是保險絲。電阻是單純的長方形。"},{"sec":"01","n":43,"ans":1,"stem":"左圖所示之符號為","opts":["接地","短路","斷路","中性線"],"img":"img/01-043.png","ex":"一條直線接到下方斜線（或短橫線），代表接地。"},{"sec":"01","n":44,"ans":4,"stem":"如左圖所示之符號為","opts":["驅動線圈","電磁接觸器","磁場線圈","比流器"],"img":"img/01-044.png","ex":"一次側端子標 K、二次側端子標 L，是比流器（CT）的端子標示。"},{"sec":"01","n":45,"ans":4,"stem":"如左圖所示之符號為","opts":["SCR","UJT","NPN晶體","PNP晶體"],"img":"img/01-045.png","ex":"射極箭頭指向內部是 PNP，箭頭朝外是 NPN。記法：PNP 是「Pointing iN」。"},{"sec":"01","n":46,"ans":1,"stem":"如下圖所示氣壓控制閥，其型式為","opts":["四孔二位閥","四孔三位閥","五孔二位閥","五孔三位閥"],"img":"img/01-046.png","ex":"數接口：A、B、P、R 共 4 個口；數方格：2 格就是 2 個位置。所以是四孔（口）二位閥。"},{"sec":"01","n":47,"ans":2,"stem":"通電開始計時的延時電驛，其計時到接點斷開的接點符號為","opts":["","","",""],"img":null,"oimg":["img/01-047-1.png","img/01-047-2.png","img/01-047-3.png","img/01-047-4.png"],"ex":"通電後開始計時、時間到才把接點斷開，就是通電延時的 b 接點（限時動作 b 接點），對應選項 ②。"},{"sec":"01","n":48,"ans":4,"stem":"限制開關LS未受到碰觸時，其內部b接點的電路符號為","opts":["","","",""],"img":null,"oimg":["img/01-048-1.png","img/01-048-2.png","img/01-048-3.png","img/01-048-4.png"],"ex":"限制開關沒被碰觸時，b 接點是閉合的。④ 是接點閉合、擋塊在下方的畫法。"},{"sec":"01","n":49,"ans":3,"stem":"如下圖所示IEC國際標準符號為","opts":["限時動作之常開接點","緊急停止用之常閉接點","積熱過載保護電驛常開接點","轉動以啟閉之常開接點"],"img":"img/01-049.png","ex":"操作記號是「ㄈ」形，代表熱動元件，所以是積熱（過載）保護電驛；接點平時打開，是常開接點。"},{"sec":"01","n":50,"ans":3,"stem":"如下圖所示，IEC國際標準符號為","opts":["電磁接觸器輔助常開接點","電磁接觸器線圈","電磁接觸器輔助常閉接點","輔助電驛常開接點"],"img":"img/01-050.png","ex":"KM 是電磁接觸器的代號。刀片上端有勾，代表常閉，所以是電磁接觸器的輔助常閉接點。"},{"sec":"01","n":51,"ans":1,"stem":"如下圖所示，IEC國際標準符號為","opts":["限時電驛線圈","輔助電驛線圈","指示燈","溫度開關線"],"img":"img/01-051.png","ex":"線圈方框旁加一個打叉的小格，是限時電驛（計時器）線圈。"},{"sec":"01","n":52,"ans":2,"stem":"如下圖所示，IEC國際標準符號為","opts":["限時電驛通電延時常閉接點","限時電驛通電延時常開接點","限時電驛斷電延時常閉接點","限時電驛斷電延時常開接點"],"img":"img/01-052.png","ex":"刀片上有圓弧形（降落傘）延時記號，接點是常開，題庫定為通電延時常開接點，也就是限時動作 a 接點。"},{"sec":"01","n":53,"ans":1,"stem":"如下圖所示，IEC國際標準符號為","opts":["限時電驛通電延時常閉接點","限時電驛通電延時常開接點","限時電驛斷電延時常閉接點","限時電驛斷電延時常開接點"],"img":"img/01-053.png","ex":"延時記號跟第 52 題一樣，但接點是常閉，所以是通電延時常閉接點，也就是限時動作 b 接點。"},{"sec":"01","n":54,"ans":4,"stem":"下圖為兩只電磁接觸器（KM1、KM2）主接點符號，中間虛線及▽符號代表兩只電磁接觸器","opts":["通電延時","電器連鎖","斷電延時","機械連鎖"],"img":"img/01-054.png","ex":"兩組主接點之間用虛線連起來並加上「▽」，代表機械連鎖：兩只接觸器不能同時吸合，常用在正反轉電路。"},{"sec":"01","n":55,"ans":2,"stem":"如下圖所示為電動機保護斷路器之IEC符號，此斷路器具有下列何保護功能","opts":["短路、延時","短路、過載","延時、過載","跳脫、變頻"],"img":"img/01-055.png","ex":"每一相都有兩種保護元件：「ㄈ」形熱動元件負責過載，「I>」瞬時電磁元件負責短路。所以保護功能是短路和過載。"},{"sec":"01","n":56,"ans":3,"stem":"閃爍電驛a接點的符號為","opts":["","","",""],"img":null,"oimg":["img/01-056-1.png","img/01-056-2.png","img/01-056-3.png","img/01-056-4.png"],"ex":"③ 接點中間畫菱形，是閃爍電驛（Flicker Relay）a 接點的畫法。"},{"sec":"01","n":57,"ans":3,"stem":"如下圖所示為電動機保護斷路器之IEC符號，其操作方式為","opts":["自動切換自動跳脫","自動切換手動跳脫","手動切換自動跳脫","手動切換手動跳脫"],"img":"img/01-057.png","ex":"左邊的操作記號代表用手動切換（投入）；右邊的熱動元件與「I>」動作時會自動跳脫。所以是手動切換、自動跳脫。"},{"sec":"01","n":58,"ans":2,"stem":"如下圖所示氣壓控制閥，其型式為","opts":["五口三位中位全開並附手動開關","五口三位中位全閉並附手動開關","三口五位中位全閉並附手動開關","三口五位中位全開並附手動開關"],"img":"img/01-058.png","ex":"有 3 個方格，所以是 3 位；共 5 個口。中間那格各口都被「T」堵住，代表中位全閉。兩端除了電磁線圈，還有手動操作記號。"},{"sec":"01","n":59,"ans":3,"stem":"如下圖所示氣壓控制閥，其型式為","opts":["二口五位自動復歸","三口五位中位全閉","五口二位自動復歸","五口三位中位全閉"],"img":"img/01-059.png","ex":"有 2 個方格，所以是 2 位，共 5 個口。右邊有彈簧，代表放開後會自動復歸，也就是單邊電磁閥。"},{"sec":"01","n":60,"ans":3,"stem":"如右圖所示之符號為","opts":["三相三線△接法","三相三線Y接法","三相三線△接法，一線（相）接地","三相四線Y接法"],"img":"img/01-060.png","ex":"三角形代表 △ 接線，三相三線；其中一個角接到接地符號，代表一線（相）接地。"},{"sec":"01","n":61,"ans":1,"stem":"如右圖根據IEC國際標準符號所示為","opts":["可變電阻器","固定電阻器","可調自耦變壓器","變壓器"],"img":"img/01-061.png","ex":"電阻的長方形上加一個斜向箭頭，代表阻值可以調整，是可變電阻器。"},{"sec":"02","n":1,"ans":3,"stem":"使用中心沖的作用為","opts":["測距離","鑽孔","定位","攻牙"],"img":null,"ex":"鑽孔前先用中心沖打出一個小凹點，讓鑽頭定位不會滑走。"},{"sec":"02","n":2,"ans":2,"stem":"水平儀的用途為","opts":["劃垂直線","檢查水平度","檢查直角度","劃圓形"],"img":null,"ex":"水平儀是用氣泡位置檢查物體是否水平。"},{"sec":"02","n":3,"ans":1,"stem":"在配電盤箱上劃線時，可使用工具為","opts":["石墨筆","銼刀","起子","劃線針"],"img":null,"ex":"在盤箱烤漆面上劃線要用石墨筆（鉛筆），劃線針會刮傷漆面。"},{"sec":"02","n":4,"ans":1,"stem":"使用鑽床時，調整鑽台高度使鑽頭與材料之距離約","opts":["10～20mm","40～50mm","80～90mm","120～150mm"],"img":null,"ex":"鑽頭和材料的距離約 10～20mm。距離太遠，鑽削行程變長，也比較不穩。"},{"sec":"02","n":5,"ans":2,"stem":"欲攻M4之螺牙，其攻牙前所鑽之孔徑應為","opts":["2.6～2.8 φ","3.0～3.4 φ","3.6～3.8 φ","4.0～4.2 φ"],"img":null,"ex":"攻牙底孔的孔徑約等於「螺紋外徑 − 螺距」。M4 的螺距是 0.7，4 − 0.7 = 3.3mm，落在 3.0～3.4 之間。"},{"sec":"02","n":6,"ans":4,"stem":"螺絲攻其第一攻、第二攻、第三攻的區別","opts":["牙距之大小","牙距之深淺","孔之大小","倒角牙紋數之多少"],"img":null,"ex":"三支一組的螺絲攻，差別在前端倒角的牙數：第一攻倒角最多，比較好導入；第三攻最少，用來把牙攻到底。"},{"sec":"02","n":7,"ans":1,"stem":"操作砂輪機時，應配戴","opts":["安全眼鏡","望遠鏡","隱形眼鏡","近視眼鏡"],"img":null,"ex":"砂輪機會噴出火花和碎屑，一定要戴安全眼鏡。"},{"sec":"0 ":"接觸型驗電筆會亮，是因為有微小電流經過人體流到地，形成迴路。"},{"sec":"02","n":49,"ans":2,"stem":"人體的電阻比正常接地電阻為","opts":["小","大","因人而異","因地而異"],"img":null,"ex":"人體電阻約數千 Ω，遠大於接地電阻（數十 Ω 以下）。所以漏電時，電流大部分會經接地線流走。"},{"sec":"02","n":50,"ans":1,"stem":"工作人員如肢體受傷出血，應將傷部","opts":["高舉","平放","放低","頭部朝下"],"img":null,"ex":"受傷出血時，把傷部抬高到心臟以上，可以減少出血。"},{"sec":"02","n":51,"ans":2,"stem":"國產指針型三用電表撥在歐姆檔作測量時，紅棒插在「＋」端插孔，黑棒插在「–」端插孔，此時黑棒是與其內部電池","opts":["負極接通","正極接通","斷路","短路"],"img":null,"ex":"指針型三用電表撥到歐姆檔時，黑棒（－端）是接內部電池的正極，紅棒反而是負電位。這點跟數位電表相反。"},{"sec":"02","n":52,"ans":1,"stem":"某人觸電遇難須搭救時，應先","opts":["移開接觸之帶電體","檢查心臟是否仍在跳動","檢查呼吸是否正常","用手拉開遇難者與帶電體後再行急救"],"img":null,"ex":"救觸電的人要先切斷電源，或用絕緣物把帶電體移開。不可以直接用手拉，否則自己也會觸電。"},{"sec":"02","n":53,"ans":4,"stem":"有關防止感電，下列何者不宜？","opts":["停電作業","手腳清潔乾燥","鞋子應為膠鞋且清潔乾燥","赤腳作業"],"img":null,"ex":"赤腳作業時，人和地面之間的電阻很小，容易觸電。"},{"sec":"02","n":54,"ans":3,"stem":"家庭用之無熔線斷路器較為常用的過載跳脫方式為","opts":["完全電磁式","熱動電磁式","熱動式","電子式"],"img":null,"ex":"家庭用的無熔線斷路器，多半是熱動式（雙金屬片）過載跳脫。"},{"sec":"02","n":55,"ans":4,"stem":"換裝保險絲時，應注意下列何種事項？","opts":["所使用的保險絲，其電流容量不要過小，以免經常更換","以鐵絲或銅絲取代，以防再斷","使用電流容量約等於安全電流3到4倍的保險絲","遵照電路電流量，選用適宜的保險絲"],"img":null,"ex":"保險絲要依電路電流選用適合的規格。不能用鐵絲、銅絲代替，也不能選太大的。"},{"sec":"02","n":56,"ans":4,"stem":"執行檢修作業中，下列何者為正確的態度？","opts":["精神恍惚，打瞌睡","可談天說話","可邊工作，邊聽熱門音樂","遵守各種職業安全衛生相關規定"],"img":null,"ex":"執行檢修作業時，要遵守職業安全衛生的相關規定。"},{"sec":"02","n":57,"ans":2,"stem":"在器具板上施行盤箱加工，做鑽孔、攻牙時，必須配戴","opts":["耳機、安全帽","耳塞（或耳罩）、護目鏡","口罩、安全帽","口罩、護目鏡"],"img":null,"ex":"鑽孔、攻牙會有噪音和金屬屑，要戴耳塞（或耳罩）和護目鏡。"},{"sec":"02","n":58,"ans":4,"stem":"在器具板上施行盤箱加工，若要鑽孔時，必須使用","opts":["釘槍","鐵鎚","攻牙機","手電鑽"],"img":null,"ex":"鑽孔要用手電鑽。"},{"sec":"02","n":59,"ans":3,"stem":"在器具板上施行盤箱加工，鑽孔後，若要攻牙時，必須使用","opts":["釘槍","鐵鎚","攻牙機","手電鑽"],"img":null,"ex":"攻牙要用攻牙機。"},{"sec":"02","n":60,"ans":3,"stem":"以O型絕緣端子製作接地線時，應使用壓接工具為","opts":["斜口鉗","電工鉗","絕緣端子壓接鉗","切管器"],"img":null,"ex":"O 型絕緣端子要用絕緣端子壓接鉗壓接。"},{"sec":"02","n":61,"ans":3,"stem":"如下圖所示，為液面控制器感測棒E1、E2、E3，其中須接地之感測棒為","opts":["E1","E2","E3","任一感測棒"],"img":"img/02-061.png","ex":"液面控制器裡最長的 ex":"串聯總電阻 ＝ 0.5 ＋ 1.5 ＋ 4 ＝ 6Ω，電流 I ＝ 12V ÷ 6Ω ＝ 2A。"},{"sec":"03","n":16,"ans":1,"stem":"動圈式交流電表由面板刻度上所讀得之值為量測值之","opts":["有效值","平均值","瞬間值","最大值"],"img":null,"ex":"交流電表的刻度是依有效值（RMS）刻劃的，所以讀到的就是有效值。"},{"sec":"03","n":17,"ans":2,"stem":"應使用超倍刻劃電流表之電路為","opts":["電熱電路","電動機電路","照明電路","太陽能電路"],"img":null,"ex":"電動機起動電流可達額定的 5～7 倍，所以要用超倍刻劃電流表：刻度後段壓縮，起動時指針不會打表。"},{"sec":"03","n":18,"ans":4,"stem":"使用一只伏特表及一只安培表測電熱器之消耗功率時，下列何者為正確接法？","opts":["","","",""],"img":null,"oimg":["img/03-018-1.png","img/03-018-2.png","img/03-018-3.png","img/03-018-4.png"],"ex":"④ 電流表與電熱器串聯、電壓表與電熱器並聯。P ＝ V × I。"},{"sec":"03","n":19,"ans":3,"stem":"量測交流單相電動機之有效功率，所需儀表之組合為","opts":["電壓表、電流表、轉速表","電壓表、頻率表、功因表","電壓表、電流表、功因表","電流表、頻率表、功因表"],"img":null,"ex":"單相有效功率 P ＝ V × I × cosθ，所以要電壓表、電流表、功因表。"},{"sec":"03","n":20,"ans":1,"stem":"以兩瓦特表測量三相電功率，若兩讀數相等，則表示功率因數為","opts":["1","0.866","0.5","0"],"img":null,"ex":"兩瓦特表法：兩表讀數相等時，相角 θ ＝ 0°，功率因數 ＝ 1。讀數差越大，功因越低。"},{"sec":"03","n":21,"ans":1,"stem":"配合PT、CT使用之三相三線式瓩時表的電流線圈接線端應接於","opts":["CT","PT","大地","器具外殼"],"img":null,"ex":"瓩時表的電流線圈接比流器（CT）二次側，電壓線圈接比壓器（PT）二次側。"},{"sec":"03","n":22,"ans":2,"stem":"家庭用的機械式瓩時表，依據下列何種原理運轉？","opts":["靜電型原理","感應型原理","可動線圈型原理","可動鐵片型原理"],"img":null,"ex":"家用機械式電度表是感應型：電壓線圈和電流線圈的磁場在鋁盤上感應渦流，產生轉矩讓鋁盤轉動。"},{"sec":"03","n":23,"ans":1,"stem":"在有負載情形下，單相二線式瓦時表電壓端接頭脫落，則轉盤會產生下列何種情況？","opts":["靜止不動","增快","減慢","不影響"],"img":null,"ex":"電壓線圈斷了就少了一組磁場，無法產生轉矩，轉盤會停止不動。"},{"sec":"03","n":24,"ans":2,"stem":"KVAR表是量測負載之","opts":["有效功率","無效功率","視在功率","直流電流"],"img":null,"ex":"VAR 是無效功率的單位，KVAR 表量的是無效功率。"},{"sec":"03","n":25,"ans":3,"stem":"在三相電路中，當瓦特表指示為1.3KW、線電壓為200V、線電流為5A時，則其功率因數接近","opts":["45％","63％","75％","82％"],"img":null,"ex":"三相功率 P ＝ √3 × V × I × cosθ。cosθ ＝ 1300 ÷ (1.732 × 200 × 5) ≈ 0.75，也就是 75%。"},{"sec":"03","n":26,"ans":1,"stem":"頻率表在刻度盤上常以Hz單位標示，其意為","opts":["每秒鐘之週波數","每分鐘之週波數","每刻鐘之週波數","每小時之週波數"],"img":null,"ex":"Hz（赫茲）＝ 每秒的週波數。"},{"sec":"03","n":27,"ans":1,"stem":"頻率表之接法為","opts":["與電壓表並聯","與電壓表串聯","與電流表串聯","與電流表並聯"],"img":null,"ex":"頻率表是接在電源兩端量電壓的頻率，接法跟電壓表一樣，是並聯。"},{"sec":"03","n":28,"ans":2,"stem":"惠斯頓電橋可量測","opts":["頻率","電阻","電流","電壓"],"img":null,"ex":"惠斯頓電橋利用電橋平衡原理量測電阻。"},{"sec":"03","n":29,"ans":2,"stem":"使用指針型三用電表量測未知電壓，其選擇開關應先置於","opts":["最低電壓檔","最高電壓檔","任意檔位","中間檔位再視其指示情形轉向適當電壓處"],"img":null,"ex":"不知道電壓多大時，先撥到最高電壓檔，再逐檔往下調，避免燒表。"},{"sec":"03","n":30,"ans":3,"stem":"使用指針型三用電表測量電阻時，則","opts":["不必作零歐姆調整","僅需作一次零歐姆調整","每調換量測檔位時需作零歐姆調整","購買時已由廠商作好零歐姆調整"],"img":null,"ex":"指針型三用電表每換一個歐姆檔，內部的分流電阻就不同，所以每次換檔都要重新歸零。"},{"sec":"03","n":31,"ans":1,"stem":"三用電表之靈敏度愈佳，則其Ω/V","opts":["愈大","愈小","無關","不一定"],"img":null,"ex":"靈敏度用 Ω/V 表示。數值越大，代表電表內阻越大、從電路吸走的電流越小，量測越準。"},{"sec":"03","n":32,"ans":4,"stem":"排除控制電路故障，最簡便之檢查儀表為","opts":["電流表","電壓表","高阻計","三用電表"],"img":null,"ex":"三用電表可以量電壓、電阻、導通，是查修控制電路最簡便的工具。"},{"sec":"03","n":33,"ans":4,"stem":"高阻計（Megger）能測量","opts":["電壓","電流","接地電阻","絕緣電阻"],"img":null,"ex":"高阻計（Megger）輸出高壓，用來量絕緣電阻，單位是 MΩ。"},{"sec":"03","n":34,"ans":4,"stem":"使用高阻計，測試電動機之繞組與外殼之絕緣電阻，其接法為","opts":["L、E兩端分接電動機內同一繞組之兩端","L、E兩端分接電動機內兩不同之繞組","L端接電動機外殼，E端接繞組","E端接電動機外殼，L端接繞組"],"img":null,"ex":"量繞組對外殼的絕緣電阻時，E（Earth）端接外殼（地），L（Line）端接繞組。"},{"sec":"03","n":35,"ans":2,"stem":"用高阻計測定電動機繞組與外殼之絕緣電阻時，若指針指示為25MΩ，則其歐姆值為","opts":["2.5×10^{8} Ω","2.5×10^{7} Ω","2.5×10^{4} Ω","2.5×10^{3} Ω"],"img":null,"ex":"1MΩ ＝ 10⁶Ω，所以 25MΩ ＝ 25 × 10⁶ ＝ 2.5 × 10⁷Ω。"},{"sec":"03","n":36,"ans":1,"stem":"鈎式電表測量電路電流時，則","opts":["可不必切斷電路就可測量電流","切斷後串聯","切斷後並聯","與負載並聯"],"img":null,"ex":"鈎表用鉗口套住導線，靠感應量電流，不用切斷電路。"},{"sec":"03","n":37,"ans":3,"stem":"有關鈎式電表，下列敘述何者錯誤？","opts":["可不切斷電路來測量電流","只需鈎住一條電源線即可測量電流","需切斷電線串聯使用","一般皆兼具有測量電阻及電壓的功能"],"img":null,"ex":"鈎表的優點就是不用切斷電線，「需切斷電線串聯使用」是錯的。"},{"sec":"03","n":38,"ans":2,"stem":"夾式電表是利用下列何者配合其他零件所組成？","opts":["整流器","比流器","分流器","比壓器"],"img":null,"ex":"夾式電表的鉗口其實就是比流器（CT）的鐵心，導線就是一次側。"},{"sec":"03","n":39,"ans":1,"stem":"電流切換開關切換時，未經過電流表之各相電流應予","opts":["短路","開路","流經電容","流經電阻"],"img":null,"ex":"電流切換開關切換時，沒有接到電流表的那幾相 CT 二次側要短路。CT 二次側絕對不能開路，否則會產生高壓。"},{"sec":"03","n":40,"ans":1,"stem":"使用電壓切換開關之目的為","opts" ","可正常動作且不發生問題","斷續動作"],"img":null,"ex":"直流沒有電感抗，線圈只剩很小的導線電阻，電流非常大，所以交流線圈接直流會燒毀。"},{"sec":"03","n":53,"ans":3,"stem":"熱動式過載電驛通過過載電流愈大時，則","opts":["其動作時間愈長","其動作時間與過電流之大小無關","其動作時間愈短","其動作時間為不變"],"img":null,"ex":"熱動式過載電驛是反時限特性：過載電流越大，雙金屬片越快受熱彎曲，動作時間越短。"},{"sec":"03","n":54,"ans":2,"stem":"積熱電驛（Thermal Relay）之功用在於保護","opts":["線路短路","電動機過載","接地","絕緣不良"],"img":null,"ex":"積熱電驛（TH-RY）是保護電動機過載用的。"},{"sec":"03","n":55,"ans":2,"stem":"使用三用電表測試未接線之電磁接觸器，其a接點兩端之電阻值應為","opts":["零歐姆","無窮大歐姆","100Ω","50Ω"],"img":null,"ex":"a 接點平時打開，所以量到的是無窮大（∞）。"},{"sec":"03","n":56,"ans":1,"stem":"積熱型過載電驛跳脫原因係","opts":["受熱動作","受光動作","受壓力差距動作","受電磁吸力動作"],"img":null,"ex":"積熱電驛靠電流產生的熱讓雙金屬片彎曲而跳脫。"},{"sec":"03","n":57,"ans":3,"stem":"限制開關之規格為「輪動型、1a1b（無共同點）、10A」，該限制開關之接線端點有","opts":["2個","3個","4個","5個"],"img":null,"ex":"1a1b 而且無共同點，a、b 接點各有 2 個端子，共 4 個。如果有共同點（c 接點）就是 3 個。"},{"sec":"03","n":58,"ans":4,"stem":"電磁接觸器之主要功能在","opts":["保護短路電流","保護過載電流","防止接地事故","接通及切斷電源"],"img":null,"ex":"電磁接觸器（MC）的主要功能是用小電流的線圈去接通、切斷主電源。保護功能要靠積熱電驛或斷路器。"},{"sec":"03","n":59,"ans":1,"stem":"電磁接觸器容量之大小一般係指","opts":["主接點容量","輔助接點容量","線圈電壓","線圈頻率"],"img":null,"ex":"電磁接觸器的容量指主接點能承受的電流容量。"},{"sec":"03","n":60,"ans":4,"stem":"交流電磁接觸器內部鐵心具有短路環，其作用下列何者錯誤？","opts":["穩定磁力線","減少雜音","產生第二磁場","增大額定容量"],"img":null,"ex":"短路環的作用是在交流電流過零點時，另外產生一個相位錯開的磁場，維持吸力、減少振動和雜音，跟額定容量無關。"},{"sec":"03","n":61,"ans":4,"stem":"絕緣導線線徑在多少公厘以上應使用絞線？","opts":["1.6","2.0","2.6","3.2"],"img":null,"ex":"依屋內線路規定，3.2mm 以上的導線應使用絞線，比較好彎曲施工。"},{"sec":"03","n":62,"ans":1,"stem":"電子在導體中移動速率","opts":["約與光速相等","極低","較光速低，比音速高","與音速相等"],"img":null,"ex":"題庫答案指的是電能（電場）在導體中的傳播速度，約與光速相等。電子本身的漂移速度其實很慢。"},{"sec":"03","n":63,"ans":3,"stem":"半導體的原子結構中，最外層軌道上的電子數","opts":["多於4個","少於4個","等於4個","等於1個"],"img":null,"ex":"半導體（矽、鍺）是 4 價元素，最外層有 4 個價電子。"},{"sec":"03","n":64,"ans":4,"stem":"一只燈泡每秒內通過1.25×10^{18}個電子，其電流為多少？（1A＝每秒通過6.25×10^{18}個電子）","opts":["0.1A","0.15A","0.25A","0.2A"],"img":null,"ex":"I ＝ 電子數 ÷ 每安培的電子數 ＝ 1.25 × 10¹⁸ ÷ 6.25 × 10¹⁸ ＝ 0.2A。"},{"sec":"03","n":65,"ans":4,"stem": 微亮","GL_{1}、GL_{4}亮，GL_{2}、GL_{3}微亮"],"img":"img/06-008.png","ex":"依題庫答案：A_{1}、A_{4} 閉合時，GL_{2} 單獨跨在電源上，所以最亮；GL_{1}、GL_{3}、GL_{4} 則串聯分壓，只會微亮。"},{"sec":"06","n":9,"ans":2,"stem":"如下圖所示，A、B兩接點之作用為","opts":["連動","避免同時投入","保持接點","可同時投入"],"img":"img/06-009.png","ex":"A 的線圈迴路串 B 的 b 接點、B 的線圈迴路串 A 的 b 接點，這是互鎖，避免 A、B 同時投入。"},{"sec":"06","n":10,"ans":2,"stem":"頻率上升時，電容器之容抗值","opts":["增加","減少","不變","先增後減"],"img":null,"ex":"容抗 X_C ＝ 1/(2πfC)，頻率上升容抗減少。"},{"sec":"06","n":11,"ans":3,"stem":"電路裝配完成後，通電試驗前，應首先確認","opts":["時間電驛設定是否正確","電路有無保險絲等適當的保護裝置","電路配線確實按圖施工","積熱電驛設定值是否正確"],"img":null,"ex":"通電前第一件事是確認配線是否確實按圖施工，避免接錯造成短路。"},{"sec":"06","n":12,"ans":1,"stem":"控制箱裝置配線完成後，作通電試驗前","opts":["須作靜態功能測試","換裝小安培數保險絲再作試驗","取下所有時間電驛之本體再作測試","取下所有電力電驛之本體再作測試"],"img":null,"ex":"通電前要先做靜態測試：不送電，用三用電表檢查導通、絕緣和各器具動作。"},{"sec":"06","n":13,"ans":2,"stem":"控制箱裝置配線完成後，作通電試驗前","opts":["須先以弱電（如12VDC）作功能測試","須先確認電源電壓","連接之電源須先串接100W燈泡，以防短路事故","不必確認所有接地線是否全部連接在一起"],"img":null,"ex":"通電前要先確認電源電壓跟控制電路、器具的額定電壓相符。"},{"sec":"06","n":14,"ans":4,"stem":"控制箱裝置配線完成後，作通電試驗前，下列何種動作可不必實施？","opts":["將器具上未接線之螺絲鎖緊","確認電磁接觸器線圈之額定電壓","依電路圖設定時間電驛","將栓型保險絲取下，換裝小安培數保險絲，以防短路"],"img":null,"ex":"保險絲要依設計規格裝設，不必也不應該換成小安培數。鎖緊螺絲、確認線圈電壓、設定計時器都是要做的。"},{"sec":"06","n":15,"ans":2,"stem":"當控制箱上之過載指示燈亮時，則","opts":["將供給此控制箱及其他負載之總開關切離","先切離此控制箱之電源","將此控制箱控制電路上之保險裝置切離","將過載保護裝置強迫復歸"],"img":null,"ex":"過載指示燈亮表示這台設備過載，要先切離此控制箱的電源，查明原因再處理。不可以強迫復歸。"},{"sec":"06","n":16,"ans":3,"stem":"在通電情況下，已在現場運轉之控制箱，電源指示燈突然不亮時，不可能之原因為","opts":["指示燈泡燒毀","指示燈內之變壓器燒毀","主電路中之電磁接觸器主接點突然無法閉合","現場突然停電"],"img":null,"ex":"電源指示燈接在電源側，不經過電磁接觸器主接點。所以主接點故障不會讓電源指示燈熄滅。"},{"sec":"06","n":17,"ans":4,"stem":"三相鼠籠型感應電動機接線盒內之導線數為","opts":["3條","4條","5條","6條"],"img":null,"ex":"三相繞組共 6 個線頭（U、V、W、X、Y、Z），引出到接線盒。"},{"sec":"06","n":18,"ans":3,"stem":"當更換感應電動機時，則","opts":["可換裝為較大馬力之電動機","連接至控制箱之導線需同時更換","電動機之外殼接地仍需配置","固定孔不合時可減少固定點"],"img":null,"ex":"不論換哪一台電動機，外殼接地都一定要接。"},{"sec":"06","n":19,"ans":1,"stem":"換裝雙浮球開關時，雙浮球間之距離","opts":["視水槽深度作調整","視電壓大作調整","視電動機馬力數作調整","視耗電量作調整"],"img":null,"ex":"雙浮球間的距離決定啟停水位，要依水槽深度調整。"},{"sec":"06","n":20,"ans":3,"stem":"更換溫度控制器之感溫棒時，其接線","opts":["需配合溫度設定範圍","需考慮電壓大小","應與溫度控制器直接連結，不得經過端子台","需考慮周圍溫度"],"img":null,"ex":"感溫棒的線要直接接到溫度控制器，不能經過端子台。中間多一個接點會產生接觸電阻或熱電勢，造成量測誤差。"},{"sec":"06","n":21,"ans":2,"stem":"不影響電磁接觸器主接點之壽命者為","opts":["啟斷電流","額定電流","短路電流","開閉頻率"],"img":null,"ex":"主接點壽命跟啟斷電流、短路電流、開閉頻率有關。額定電流是設計值，在額定內使用不影響壽命。"},{"sec":"06","n":22,"ans":2,"stem":"在三點式按鈕開關中FWD之標示代表","opts":["過載","正轉","逆轉","停止"],"img":null,"ex":"FWD＝Forward，正轉；REV＝Reverse，逆轉。"},{"sec":"06","n":23,"ans":2,"stem":"換裝交流電流表時，則","opts":["以同刻度範圍者更換不必考慮電流表之CT比","以同刻度範圍及相同CT比者更換","以延長刻度相同CT比者更換","以較大刻度範圍者更換"],"img":null,"ex":"電流表刻度要配合 CT 比，所以要用同刻度範圍、同 CT 比的電流表更換。"},{"sec":"06","n":24,"ans":3,"stem":"無熔線斷路器啟斷容量之選定依","opts":["線路之電壓降","功率因數","短路電流","額定電流"],"img":null,"ex":"啟斷容量要大於裝設點的最大短路電流。"},{"sec":"06","n":25,"ans":2,"stem":"使用指針型三用電表測試二極體時，電表之歐姆檔指示值很小，則三用電表紅棒所連接之二極體端點為","opts":["P端","N端","接地點","無法判定"],"img":null,"ex":"指針型三用電表歐姆檔的黑棒接內部電池正極。讀值很小表示二極體順向導通，黑棒接 P、紅棒接 N。"},{"sec":"06","n":26,"ans":2,"stem":"穩壓電路中，稽納二極體之正端接電源之","opts":["正端","負端","接地端","中性點"],"img":null,"ex":"稽納二極體要逆向偏壓才能穩壓，所以它的正端（P）接電源負端。"},{"sec":"06","n":27,"ans":4,"stem":"旋轉電機機械，因過載而引起過熱之主要原因為","opts":["摩擦損","鐵損","漂游損","銅損"],"img":null,"ex":"過載時電流增大，銅損 I²R 跟電流平方成正比，是發熱的主因。"},{"sec":"06","n":28,"ans":3,"stem":"更換近接開關時，則","opts":["以外徑相同者取代","以外加電壓相同者取代","以特性及尺寸相同者取代","以外殼材質相同者取代"],"img":null,"ex":"近接開關要用特性（偵測方式、距離、電源、輸出型式）和尺寸都相同的來取代。"},{"sec":"06","n":29,"ans":2,"stem":"負載超過CT額定負擔時，所連接之電流計指示值","opts":["增大","減少","不變","無作用"],"img":null,"ex":"CT 負擔超過額定時，二次側誤差變大，電流表的讀數會偏低。"},{"sec":"06","n":30,"ans":4,"stem":"非高阻抗型之電極式液面控制器在下列何種液體中沒有作用？","opts":["井水","山泉水","自來水","蒸餾水"],"img":null,"ex":"蒸餾水幾乎不導電，一般電極式液面控制器偵測不到。"},{"sec":"06","n":31,"ans":3,"stem":"鋁、銅、鐵、黃銅四種材料中之電阻最大者為","opts":["鋁","銅","鐵","黃銅"],"img":null,"ex":"電阻係數：鐵 ＞ 黃銅 ＞ 鋁 ＞ 銅，所以鐵最大。"},{"sec":"06","n":32,"ans":4,"stem":"三相感應電動機起動時在下列四種起動方法中轉矩最大者為","opts":["Y－△起動","二次電阻起動","自耦變壓器起動","全壓起動"],"img":null,"ex":"全壓起動加的是全電壓，起動轉矩最大；各種降壓起動的轉矩都會變小         <span class="prog"><span class="tr"><i style="width:${d/qs.length*100}%"></i></span><span class="num">${d}/${qs.length}</span>${w?`<span>· 錯 ${w}</span>`:''}</span></span>
      <span class="ck">${on?'✓':''}</span></button>
      ${on?`<div class="rng ${r?'cust':''}">題號 <input type="number" inputmode="numeric" min="1" max="${qs.length}" value="${r?r[0]:1}" data-ra="${k}" aria-label="起始題號"> – <input type="number" inputmode="numeric" min="1" max="${qs.length}" value="${r?r[1]:qs.length}" data-rb="${k}" aria-label="結束題號"> <span data-rs="${k}">${r?`<b>${r[1]-r[0]+1}</b> / ${qs.length} 題`:`全部 ${qs.length} 題`}</span><button class="full ${r?'':'hide'}" data-full="${k}">改回全部</button></div>`:''}</div>`};
  const n=pool().length;
  app.innerHTML=`
  <section class="panel">
    <div class="screws"><i></i><i></i></div>
    <div class="ttl"><span class="badge">115 年起適用 · 013003A13</span>
    <h1>工業配線丙級<br>學科刷題</h1>
    <div class="sub">技術士技能檢定學科題庫 · 工作項目 01–06 · 共 ${ALL.length} 題</div></div>
    <div class="meters">
      <div class="meter"><div class="lamp ${done?'g':'off'}"></div><b class="num">${done}<small>/${ALL.length}</small></b><span>做過的題目</span></div>
      <div class="meter"><div class="lamp ${acc===null?'off':acc>=60?'g':'r'}"></div><b class="num">${acc===null?'—':acc+'<small>%</small>'}</b><span>累積正確率</span></div>
      <div class="meter"><div class="lamp ${wb?'y':'off'}"></div><b class="num">${wb}</b><span>錯題本</span></div>
    </div>
  </section>
  <div class="steps">
    <div class="step"><b class="num">1</b>勾選工作項目，需要時自訂題號範圍</div>
    <div class="step"><b class="num">2</b>選一種練習模式</div>
    <div class="step"><b class="num">3</b>按「開始」，錯的會自動進錯題本</div>
  </div>
  <div class="cols"><div class="colA">
  <h2>範圍</h2>
  <p class="lead">勾選要練的工作項目，每一區都可以改題號，只練其中一段。目前範圍共 <b id="pn">${n}</b> 題。</p>
  <div class="prs">${PRESETS.map((p,i)=>`<button class="pr ${preOn(p)?'on':''}" data-pr="${i}">${p.t}</button>`).join('')}<button class="pr" id="share">複製這個範圍的連結</button></div>
  <div class="secs">${Object.keys(SEC).map(secCard).join('')}</div>
  </div><div class="colB">
  <h2>模式</h2>
  <p class="lead">建議順序：依序練習 → 隨機刷題 → 錯題本清空 → 模擬測驗。</p>
  <div class="modes">${MODES.map(([k,t,d])=>`<button class="mode ${cfg.mode==k?'on':''}" data-m="${k}"><b>${t}${k=='wrong'&&wb?` <span class="num" style="display:inline;color:var(--amb)">${wb}</span>`:''}</b><span>${d}</span></button>`).join('')}</div>
  <div class="opts-box">
    ${cfg.mode=='exam'?`<div style="display:flex;justify-content:space-between"><span>抽題數</span><b class="num" id="nv" style="font-size:20px">${Math.min(cfg.n,n)} 題</b></div>
    <input type="range" min="10" max="${Math.max(10,Math.min(80,n))}" step="5" value="${Math.min(cfg.n,n)}" id="nr" aria-label="抽題數">
    <div class="presets">${[50,80].map(v=>`<button class="pre ${Math.min(cfg.n,n)==v?'on':''}" data-n="${v}" ${v>n?'disabled':''}>${v} 題</button>`).join('')}</div>
    <div class="lead" style="margin:2px 0 8px">${n<80?`目前範圍只有 ${n} 題，最多抽 ${n} 題。`:'段考預估 50 題，最多 80 題。'}</div>`:''}
    <label class="sw"><input type="checkbox" id="auto" ${cfg.auto?'checked':''}>${cfg.mode=='exam'?'選完答案直接跳下一題':'答對直接跳下一題（用猜的想看詳解時就關掉）'}</label>
    <label class="sw"><input type="checkbox" id="shuf" ${cfg.shuf?'checked':''}>選項順序也打亂（防止背「答案是 ③」）</label>
  </div>
  <button class="go" id="go"><span class="lamp g"></span>開始 · ${cfg.mode=='wrong'?wrongs().filter(inR).length:cfg.mode=='exam'?Math.min(cfg.n,n):n} 題</button>
  </div></div>
  <div class="foot">版本 2.1· 作答紀錄只存在這台裝置的瀏覽器裡。<br><button class="link" id="reset">清除作答紀錄</button></div>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s;cfg.secs=cfg.secs.includes(k)?cfg.secs.filter(x=>x!=k):[...cfg.secs,k].sort();if(!cfg.secs.length){cfg.secs=[k];toast('至少要選一個工作項目')}persist();home()});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.m;persist();home()});
  app.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{const p=PRESETS[+b.dataset.pr];cfg.secs=[...p.secs];cfg.rg=JSON.parse(JSON.stringify(p.rg));persist();home()});
  $('#share').onclick=async()=>{const u=location.origin+location.pathname+'#r='+rangeStr();
    try{await navigator.clipboard.writeText(u);toast('已複製範圍連結，貼給同學就好')}catch(e){await ask('複製失敗，請手動複製這個連結：\n'+u)}};
  app.querySelectorAll('[data-full]').forEach(b=>b.onclick=()=>{delete cfg.rg[b.dataset.full];persist();home()});
  const setR=k=>{const N=SN(k);let a=parseInt($(`[data-ra="${k}"]`).value)||1,b=parseInt($(`[data-rb="${k}"]`).value)||N;a=Math.max(1,Math.min(N,a));b=Math.max(1,Math.min(N,b));if(a>b)[a,b]=[b,a];if(a==1&&b==N)delete cfg.rg[k];else cfg.rg[k]=[a,b];persist();
    const ia=$(`[data-ra="${k}"]`),ib=$(`[data-rb="${k}"]`);if(document.activeElement!==ia)ia.value=a;if(document.activeElement!==ib)ib.value=b;
    const r=cfg.rg[k];$(`[data-rs="${k}"]`).innerHTML=r?`<b>${b-a+1}</b> / ${N} 題`:`全部 ${N} 題`;ia.closest('.rng').classList.toggle('cust',!!r);$(`[data-full="${k}"]`).classList.toggle('hide',!r);
    const n2=pool().length;$('#pn').textContent=n2;app.querySelectorAll('[data-pr]').forEach(b=>b.classList.toggle('on',preOn(PRESETS[+b.dataset.pr])));
    $('#go').lastChild.textContent='開始 · '+(cfg.mode=='wrong'?wrongs().filter(inR).length:cfg.mode=='exam'?Math.min(cfg.n,n2):n2)+' 題'};
  app.querySelectorAll('[data-ra],[data-rb]').forEach(i=>{i.onchange=()=>setR(i.dataset.ra||i.dataset.rb);i.onkeydown=e=>{if(e.key=='Enter')i.blur()}});
  const nr=$('#nr');if(nr)nr.oninput=()=>{cfg.n=+nr.value;$('#nv').textContent=cfg.n+' 題';$('#go').lastChild.textContent='開始 · '+cfg.n+' 題';app.querySelectorAll('.pre').forEach(b=>b.classList.toggle('on',+b.dataset.n==cfg.n));persist()};
  app.querySelectorAll('.pre').forEach(b=>b.onclick=()=>{cfg.n=+b.dataset.n;persist();home()});
  $('#shuf').onchange=e=>{cfg.shuf=e.target.checked;persist()};
  $('#auto').onchange=e=>{cfg.auto=e.target.checked;persist()};
  $('#go').onclick=start;
  $('#reset').onclick=async()=>{if(await ask('確定清除所有作答紀錄與錯題本？')){store.s={};save();home()}};
}

function start(){
  let qs;
  if(cfg.mode=='wrong'){qs=shuffle(wrongs().filter(inR));if(!qs.length){toast('這個範圍的錯題本是空的');return}}
  else if(cfg.mode=='seq') qs=pool();
  else if(cfg.mode=='random') qs=shuffle(pool());
  else qs=shuffle(pool()).slice(0,cfg.n);
  S={mode:cfg.mode,qs:qs.map(q=>({q,order:(cfg.shuf&&!q.oimg)?shuffle([0,1,2,3]):[0,1,2,3],pick:null})),i:0};
  show();
}

function show(){
  app.className='wrap is-q';
  clearTimeout(S.timer);S.timer=null;
  const it=S.qs[S.i], q=it.q, s=SEC[q.sec], exam=S.mode=='exam';
  const answered=it.pick!==null, reveal=answered&&!exam;
  const right=S.qs.filter(x=>x.pick!==null&&x.pick===x.q.ans-1).length, ans=S.qs.filter(x=>x.pick!==null).length;
  const last=S.i==S.qs.length-1;
  app.innerHTML=`
  <div class="qtop"><button class="btn" id="back">← 首頁</button>
    <button class="chip-t ${cfg.auto?'on':''}" id="autoT" aria-pressed="${cfg.auto}">${exam?'作答自動跳':'答對自動跳'} ${cfg.auto?'開':'關'}</button><span class="score">${exam?`已作答 <b class="num">${ans}</b>/${S.qs.length}`:`答對 <b class="num">${right}</b> / ${ans}`}</span></div>
  <div class="bar"><i style="width:${(S.i+1)/S.qs.length*100}%"></i></div>
  <article class="qcard" style="--c:${s.c}">
    <div class="qmeta"><span class="pill"><i></i>工作項目 ${q.sec} · ${s.name}</span><span class="num" style="font-size:15px">${S.i+1} / ${S.qs.length}</span></div>
    <div class="qmeta" style="margin-top:-4px"><span>題庫第 ${q.n} 題</span>${st(q).w?`<span style="color:var(--amb)">曾答錯 ${st(q).w} 次</span>`:''}</div>
    <div class="stem">${fmt(q.stem)}</div>
    ${q.img?`<div class="fig"><img src="${q.img}" alt="題目附圖"><small>題目附圖 · 點圖可放大</small></div>`:''}
    <div class="opts">${it.order.map((oi,pos)=>{
      let c='';if(reveal){if(oi===q.ans-1)c='ok';else if(oi===it.pick)c='bad'}else if(exam&&oi===it.pick)c='pick';
      return `<button class="opt ${c}" data-o="${oi}" ${reveal?'disabled':''}><span class="k">${pos+1}</span>${q.oimg&&q.oimg[oi]?`<img class="oimg" src="${q.oimg[oi]}" alt="選項${pos+1}">`:`<span>${fmt(q.opts[oi])}</span>`}</button>`}).join('')}</div>
    ${reveal?`<div class="fb ${it.pick===q.ans-1?'ok':'bad'}">${it.pick===q.ans-1?'✔ 答對了':'✘ 答錯，正確答案是第 '+(it.order.indexOf(q.ans-1)+1)+' 個選項，已加入錯題本'}</div>${q.ex?`<div class="ex"><b>詳解</b>${fmt(q.ex)}</div>`:''}`:''}
    ${exam&&!answered?`<div class="hint">模擬測驗不會馬上對答案，交卷後一起看。</div>`:''}
  </article>
  <div class="hint">電腦可用鍵盤：1–4 作答、Enter 下一題、← 上一題</div>`;
  $('#back').onclick=async()=>{if(S.mode!='exam'||await ask('離開會放棄這次測驗，確定？'))home()};
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  const at=$('#autoT');if(at)at.onclick=()=>{cfg.auto=!cfg.auto;persist();if(!cfg.auto)clearTimeout(S.timer);at.classList.toggle('on',cfg.auto);at.textContent=(exam?'作答自動跳 ':'答對自動跳 ')+(cfg.auto?'開':'關');at.setAttribute('aria-pressed',cfg.auto)};
  dock.classList.remove('hide');
  dockIn.innerHTML=`<button class="btn" id="prev" ${S.i?'':'disabled'}>上一題</button>
   ${exam?`<button class="btn" id="fin">交卷</button>`:''}
   <button class="btn pri" id="next" ${(!exam&&!answered)?'disabled':''}>${last?(exam?'交卷':'看結果'):'下一題 →'}</button>`;
  $('#prev').onclick=()=>{S.i--;show()};
  const submit=async()=>{const left=S.qs.filter(x=>x.pick===null).length;if(!left||await ask(`還有 ${left} 題沒作答，確定交卷？`))finish()};
  $('#next').onclick=()=>{if(last){exam?submit():finish()}else{S.i++;show()}};
  if(exam)$('#fin').onclick=submit;
  window.scrollTo(0,0);
}

function record(q,ok){
  const s=store.s[q.id]=store.s[q.id]||{c:0,w:0,wb:false};
  if(ok){s.c++;if(S.mode=='wrong')s.wb=false}else{s.w++;s.wb=true}
  save();
}
function pick(oi){
  const it=S.qs[S.i];
  if(S.mode=='exam'){it.pick=oi;if(cfg.auto&&S.i<S.qs.length-1)S.i++;show();return}
  if(it.pick!==null)return;
  it.pick=oi;const ok=oi===it.q.ans-1;record(it.q,ok);show();
  if(ok&&cfg.auto&&S.i<S.qs.length-1){S.i++;show();flash();return}
  const f=document.querySelector('.ex')||document.querySelector('.fb');if(f)f.scrollIntoView({block:'center',behavior:'smooth'});
}
function finish(){
  app.className='wrap is-q';
  if(S.mode=='exam')S.qs.forEach(it=>record(it.q,it.pick===it.q.ans-1));
  const n=S.qs.length, r=S.qs.filter(x=>x.pick===x.q.ans-1).length, score=Math.round(r/n*100);
  const miss=S.qs.filter(x=>x.pick!==x.q.ans-1);
  const secs=[...new Set(S.qs.map(x=>x.q.sec))].sort();
  dock.classList.add('hide');
  const title={seq:'依序練習',random:'隨機刷題',exam:'模擬測驗',wrong:'錯題本'}[S.mode];
  app.innerHTML=`
  <div class="qtop"><button class="btn" id="back">← 首頁</button><span class="score">${title}</span></div>
  <section class="res">
    <div class="mut">${S.mode=='exam'?'測驗成績':'這一輪的得分'}</div>
    <div class="big num" style="color:${score>=60?'#6fe39a':'#ff8a7a'}">${score}</div>
    <div>答對 ${r} / ${n} 題${S.mode=='exam'?(score>=60?' · 及格':' · 未達 60 分及格線'):''}</div>
    ${secs.length>1?`<div class="bysec">${secs.map(k=>{const a=S.qs.filter(x=>x.q.sec==k),b=a.filter(x=>x.pick===x.q.ans-1).length;return `<div style="--c:${SEC[k].c}">工作項目 ${k}<b class="num">${b}/${a.length}</b></div>`}).join('')}</div>`:''}
    <div class="row"><button class="btn pri" id="again">再來一輪</button>${miss.length?`<button class="btn" id="redo">只重做錯的 ${miss.length} 題</button>`:''}</div>
  </section>
  ${miss.length?`<h2>錯題檢討</h2><p class="lead">這些題目都已經加入錯題本。</p>${miss.map(it=>{const q=it.q;return `<div class="rv" style="--c:${SEC[q.sec].c}">
    <div class="qmeta"><span class="pill"><i></i>${q.sec}-${q.n}</span></div>
    <div class="q">${fmt(q.stem)}</div>
    ${q.img?`<div class="fig" style="margin:8px 0"><img src="${q.img}" alt=""></div>`:''}
    <div class="a mine">你的答案：${it.pick===null?'未作答':oh(q,it.pick)}</div>
    <div class="a right">正確答案：${oh(q,q.ans-1)}</div>${q.ex?`<div class="ex"><b>詳解</b>${fmt(q.ex)}</div>`:''}</div>`}).join('')}`:`<p class="lead" style="text-align:center;margin-top:16px">全對，沒有錯題。</p>`}`;
  $('#back').onclick=home;$('#again').onclick=start;
  if(miss.length)$('#redo').onclick=()=>{S={mode:S.mode=='exam'?'random':S.mode,qs:shuffle(miss).map(it=>({q:it.q,order:it.order,pick:null})),i:0};show()};
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const im=e.target.closest&&e.target.closest('.fig img');if(im){const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${im.getAttribute('src')}" alt="放大圖">`;z.onclick=()=>z.remove();document.body.appendChild(z)}});
document.addEventListener('keydown',e=>{
  {const z=document.querySelector('.zoom');if(z&&e.key=='Escape'){z.remove();return}}
  if(!S||dock.classList.contains('hide')||document.querySelector('.modal'))return;
  const it=S.qs[S.i];
  if(['1','2','3','4'].includes(e.key))pick(it.order[+e.key-1]);
  else if(e.key=='Enter'||e.key=='ArrowRight'){const n=$('#next');if(n&&!n.disabled)n.click()}
  else if(e.key=='ArrowLeft'){const p=$('#prev');if(p&&!p.disabled)p.click()}
});
home();
}
</script>
</body>
</html>
