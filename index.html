<!DOCTYPE html>

<head>

<meta name="theme-color" content="#14213d">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1d1d1f;--mut:#6b6b70;--line:#e3ddd0;--pri:#14213d;--acc:#e07a1f;--ok:#2f8f4e;--okbg:#e5f4ea;--bad:#c0392b;--badbg:#fbe7e4}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
header h1{font-size:18px;margin:0;letter-spacing:.5px}
header h1 small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer}
.btn.pri{background:var(--pri);color:var(--bg);border-color:var(--pri);font-weight:600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.sec-t{font-size:13px;color:var(--mut);margin:18px 2px 8px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chip{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font:inherit;color:inherit}
.chip b{font-size:15px}.chip span{font-size:12px;color:var(--mut)}
.chip.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.stem{font-size:18px;margin:6px 0 12px;font-weight:500}
.fig{background:#fff;border-radius:10px;padding:8px;margin-bottom:12px;border:1px solid var(--line);text-align:center}
.fig img{max-width:100%;max-height:220px;width:auto;height:auto;display:block;margin:0 auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:inherit;font:inherit;font-size:16px;cursor:pointer}
.opt .k{font-weight:700;color:var(--acc);min-width:1.3em}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.pick{border-color:var(--pri)}
.opt:disabled{cursor:default}
.oimg{max-height:72px;max-width:75%;background:#fff;border-radius:6px;padding:4px}.oimg.sm{max-height:44px;vertical-align:middle}.opt{align-items:center}
.oimg{max-height:72px;max-width:75%;background:#fff;border-radius:6px;padding:4px}.oimg.sm{max-height:44px;vertical-align:middle}.opt{align-items:center}
.fb{margin-top:12px;font-weight:600}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:720px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.res-big{font-size:48px;font-weight:800;text-align:center;margin:6px 0}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv:first-child{border-top:0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--mut);margin-right:6px}
.hide{display:none!important}
.mut{color:var(--mut);font-size:13px}
label.sw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
input[type=range]{width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.mbox{background:var(--card);border-radius:16px;padding:18px;max-width:360px;width:100%;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--pri);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:9;font-size:14px}
</style>
</head>

  <header><h1>工業配線丙級 學科刷題<small>013003A13 · 工作項目 01–03（講義 p.1–11）· 共 ${ALL.length} 題</small></h1></header>
  <div class="stats">
    <div class="stat"><b>${done}/${ALL.length}</b><span>做過的題目</span></div>
    <div class="stat"><b>${tot?Math.round(corr/tot*100):0}%</b><span>累積正確率</span></div>
    <div class="stat"><b>${wb}</b><span>錯題本</span></div>
  </div>
  <div class="sec-t">範圍</div>
  <div class="grid" id="secs">${Object.entries(SECS).map(([k,v])=>`<button class="chip ${cfg.secs.includes(k)?'on':''}" data-s="${k}"><b>工作項目 ${k}</b><span>${v} · ${ALL.filter(q=>q.sec==k).length} 題</span></button>`).join('')}</div>
  <div class="sec-t">模式</div>
  <div class="grid" id="modes">${modes.map(([k,t,d])=>`<button class="chip ${cfg.mode==k?'on':''}" data-m="${k}"><b>${t}</b><span>${d}</span></button>`).join('')}</div>
  <div class="card ${cfg.mode=='exam'?'':'hide'}" id="examOpt" style="margin-top:12px">
    <div class="row" style="justify-content:space-between"><span>題數</span><b id="nv">${cfg.n}</b></div>
    <input type="range" min="10" max="80" step="5" value="${cfg.n}" id="nr">
    <div class="mut">正式學科測驗為 80 題單選，60 分及格。</div>
  </div>
  <label class="sw" style="margin:14px 2px"><input type="checkbox" id="shuf" ${cfg.shuf?'checked':''}> 選項順序也打亂</label>
  <button class="btn pri" style="width:100%;padding:14px;font-size:17px" id="go">開始</button>
  <div class="row" style="justify-content:center;margin-top:18px"><button class="btn ghost" id="reset" style="font-size:13px;color:var(--mut)">清除作答紀錄</button></div>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s;cfg.secs=cfg.secs.includes(k)?cfg.secs.filter(x=>x!=k):[...cfg.secs,k].sort();if(!cfg.secs.length)cfg.secs=[k];persist();home()});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.m;persist();home()});
  const nr=$('#nr');nr.oninput=()=>{cfg.n=+nr.value;$('#nv').textContent=cfg.n;persist()};
  $('#shuf').onchange=e=>{cfg.shuf=e.target.checked;persist()};
  $('#go').onclick=start;
  $('#reset').onclick=async()=>{if(await ask('確定清除所有作答紀錄與錯題本？')){store.s={};save();home()}};
  window.scrollTo(0,0);
}
function persist(){store.cfg=cfg;save()}

function start(){
  let qs;
  if(cfg.mode=='wrong'){qs=shuffle(wrongs().filter(q=>cfg.secs.includes(q.sec)));if(!qs.length){toast('這個範圍的錯題本是空的');return}}
  else if(cfg.mode=='seq') qs=pool();
  else if(cfg.mode=='random') qs=shuffle(pool());
  else qs=shuffle(pool()).slice(0,cfg.n);
  S={mode:cfg.mode,qs:qs.map(q=>({q,order:(cfg.shuf&&!q.oimg)?shuffle([0,1,2,3]):[0,1,2,3],pick:null})),i:0};
  show();
}

function show(){
  const it=S.qs[S.i], q=it.q, exam=S.mode=='exam';
  const answered=it.pick!==null, reveal=answered&&!exam;
  const right=S.qs.filter(x=>x.pick!==null&&x.pick===x.q.ans-1).length, ans=S.qs.filter(x=>x.pick!==null).length;
  app.innerHTML=`
  <header><button class="btn ghost" id="back">← 回首頁</button><span class="mut">${exam?`已作答 ${ans}`:`答對 ${right}/${ans}`}</span></header>
  <div class="qmeta"><span>第 ${S.i+1} / ${S.qs.length} 題</span><span>工作項目 ${q.sec} · 第 ${q.n} 題</span></div>
  <div class="bar"><i style="width:${(S.i+1)/S.qs.length*100}%"></i></div>
  <div class="card">
    <div class="stem">${esc(q.stem)}</div>
    ${q.img?`<div class="fig"><img src="${q.img}" alt="題目附圖"></div>`:''}
    <div class="opts">${it.order.map((oi,pos)=>{
      let c='';if(reveal){if(oi===q.ans-1)c='ok';else if(oi===it.pick)c='bad'}else if(exam&&oi===it.pick)c='pick';
      return `<button class="opt ${c}" data-o="${oi}" ${reveal?'disabled':''}><span class="k">${K[pos]}</span>${q.oimg?`<img class="oimg" src="${q.oimg[oi]}" alt="選項圖">`:`<span>${esc(q.opts[oi])}</span>`}</button>`}).join('')}</div>
    ${reveal?`<div class="fb ${it.pick===q.ans-1?'ok':'bad'}">${it.pick===q.ans-1?'✔ 答對':'✘ 答錯，正解是 '+K[it.order.indexOf(q.ans-1)]}</div>`:''}
  </div>`;
  $('#back').onclick=async()=>{if(S.mode!='exam'||await ask('離開會放棄這次測驗，確定？'))home()};
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>pick(+b.dataset.o));
  dock.classList.remove('hide');
  const last=S.i==S.qs.length-1;
  dockIn.innerHTML=`<button class="btn" id="prev" ${S.i?'':'disabled'}>上一題</button>
   ${exam?`<button class="btn" id="fin">交卷</button>`:''}
   <button class="btn pri" id="next" ${(!exam&&!answered)?'disabled':''}>${last?(exam?'交卷':'看結果'):'下一題'}</button>`;
  $('#prev').onclick=()=>{S.i--;show()};
  $('#next').onclick=()=>{if(last)finish();else{S.i++;show()}};
  if(exam)$('#fin').onclick=async()=>{const left=S.qs.filter(x=>x.pick===null).length;if(!left||await ask(`還有 ${left} 題沒作答，確定交卷？`))finish()};
  window.scrollTo(0,0);
}

function record(q,ok){
  const s=store.s[q.id]=store.s[q.id]||{c:0,w:0,wb:false};
  if(ok){s.c++;if(S.mode=='wrong')s.wb=false}else{s.w++;s.wb=true}
  save();
}
function pick(oi){
  const it=S.qs[S.i];
  if(S.mode=='exam'){it.pick=oi;show();return}
  if(it.pick!==null)return;
  it.pick=oi;record(it.q,oi===it.q.ans-1);show();
}
function finish(){
  if(S.mode=='exam')S.qs.forEach(it=>{if(it.pick!==null)record(it.q,it.pick===it.q.ans-1);else record(it.q,false)});
  const n=S.qs.length, r=S.qs.filter(x=>x.pick===x.q.ans-1).length, score=Math.round(r/n*100);
  const miss=S.qs.filter(x=>x.pick!==x.q.ans-1);
  dock.classList.add('hide');
  app.innerHTML=`
  <header><button class="btn ghost" id="back">← 回首頁</button></header>
  <div class="card" style="text-align:center">
    <div class="mut">${S.mode=='exam'?'模擬測驗成績':'這一輪結果'}</div>
    <div class="res-big" style="color:${score>=60?'var(--ok)':'var(--bad)'}">${score}</div>
    <div>答對 ${r} / ${n} 題${S.mode=='exam'?(score>=60?' · 及格 🎉':' · 未達 60 分'):''}</div>
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn pri" id="again">再來一輪</button>
      ${miss.length?`<button class="btn" id="redo">只重做錯的 ${miss.length} 題</button>`:''}
    </div>
  </div>
  ${miss.length?`<div class="sec-t">錯題檢討</div><div class="card">${miss.map(it=>{const q=it.q;return `<div class="rv">
    <div><span class="tag">${q.sec}-${q.n}</span>${esc(q.stem)}</div>
    ${q.img?`<div class="fig" style="margin-top:8px"><img src="${q.img}" alt=""></div>`:''}
    <div class="mut">你的答案：${it.pick===null?'未作答':K[it.pick]+' '+oh(q,it.pick)}</div>
    <div style="color:var(--ok);font-weight:600">正解：${K[q.ans-1]} ${oh(q,q.ans-1)}</div></div>`}).join('')}</div>`:''}`;
  $('#back').onclick=home;$('#again').onclick=start;
  if(miss.length)$('#redo').onclick=()=>{S={mode:S.mode=='exam'?'random':S.mode,qs:shuffle(miss).map(it=>({q:it.q,order:it.order,pick:null})),i:0};show()};
  window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!S||!dock.offsetParent||document.querySelector('.modal'))return;
  const it=S.qs[S.i];
  if('1234'.includes(e.key)&&e.key){pick(it.order[+e.key-1])}
  else if(e.key=='Enter'||e.key=='ArrowRight'){const n=$('#next');if(n&&!n.disabled)n.click()}
  else if(e.key=='ArrowLeft'){const p=$('#prev');if(p&&!p.disabled)p.click()}
});
home();
</script>
</body>
</html>
